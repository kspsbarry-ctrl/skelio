<!DOCTYPE html>
<!-- 注意：請用本機伺服器開啟（例如 Cursor 的 Live Server 擴充功能），不要直接雙擊 HTML 檔，否則瀏覽器會封鎖從 file:// 載入 .glb 模型。 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>素樞 SKELIO — 生態缸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<style>
  :root{ --stone:#ece7de; --stone-mute:#a8a296; --ink-deep:#0c0b08; --moss:#9aa88d; --amber:#d19a52; }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{ height:100%; background:var(--ink-deep); color:var(--stone); overflow:hidden; }
  body{ font-family:'Noto Serif TC', serif; cursor:grab; }
  body.dragging{ cursor:grabbing; }
  canvas{ display:block; width:100%; height:100%; max-width:100%; touch-action:none; }
  .nav-toggle{ display:none; }
  a{ color:inherit; text-decoration:none; }
  @media (prefers-reduced-motion: reduce){
    .info > *{ transition:none; }
  }

  #canvas-wrap{ position:fixed; inset:0; z-index:1; }
  .hud{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:4.5vw;
  }
  .hud a, .hud .pick{ pointer-events:auto; cursor:pointer; }
  .top, .bottom{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .brand, .back, .counter{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.2em;
  }
  .back{ color:var(--stone-mute); opacity:1; transition:color .2s ease; }
  .back:hover{ color:var(--amber); opacity:1; }
  .info .code{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.16em; color:var(--amber); }
  .info .latin{ font-style:italic; color:var(--moss); margin-top:6px; font-size:clamp(14px,1.6vw,18px); }
  .info .name{ font-weight:700; font-size:clamp(24px,3.6vw,40px); margin-top:4px; }
  .info .specs{ font-size:13px; color:var(--moss); margin-top:8px; letter-spacing:0.06em; }
  .info .summary{ font-size:13px; line-height:1.65; max-width:420px; color:rgba(231,226,216,0.78); margin-top:8px; }
  .info .price-row{ display:flex; align-items:center; gap:14px; margin-top:14px; pointer-events:auto; }
  .info .price{ font-family:'Cinzel', serif; font-size:20px; color:var(--amber); letter-spacing:0.08em; }
  .info .action-btn{
    border:1px solid rgba(231,226,216,0.28); background:rgba(231,226,216,0.08);
    color:var(--stone); border-radius:999px; padding:7px 16px; font-size:12px;
    font-family:'Noto Serif TC', serif; cursor:pointer; transition:background .2s ease, border-color .2s ease;
  }
  .info .action-btn:hover{ background:rgba(169,121,63,0.28); border-color:var(--amber); }
  .info > *{ opacity:0; transform:translateY(10px); transition:opacity .45s ease, transform .45s ease; }
  .info.show > *{ opacity:1; transform:none; }
  .picks{ display:flex; flex-direction:column; gap:14px; align-items:flex-end; }
  .pick{
    font-family:'Noto Serif TC', serif; font-size:15px; letter-spacing:.01em;
    color:var(--stone-mute); opacity:1; background:none; border:0; padding:2px 0;
    transition:color .35s ease, transform .55s cubic-bezier(.22,.8,.2,1);
  }
  .pick:hover{ color:var(--stone); }
  .pick.active{ color:var(--stone); font-weight:700; transform:translateX(-8px); }

  .hint{
    position:fixed; bottom:4.5vw; left:50%; transform:translateX(-50%);
    z-index:3; pointer-events:none;
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.24em; color:var(--stone-mute); opacity:1;
    transition:opacity .8s ease, color .3s ease;
    max-width:min(86vw, 520px); text-align:center; line-height:1.6;
  }
  @keyframes skelio-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .hint.is-loading span::before{ animation:none; }
  }
  @media (max-width:768px), (max-height:520px) and (pointer:coarse){
    html, body{ max-width:100%; overflow-x:hidden; }
    #canvas-wrap{
      top:0; right:0; bottom:auto; left:0;
      width:100%; max-width:100%;
      height:100vh; height:100dvh;
    }
    .hud{
      padding:
        max(12px, env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        max(10px, env(safe-area-inset-bottom, 0px))
        max(12px, env(safe-area-inset-left, 0px));
    }
    .top{ align-items:center; gap:8px; }
    .back, .counter{
      min-height:44px;
      display:inline-flex; align-items:center;
      font-size:clamp(11px, 3vw, 13px);
    }
    .nav-toggle{
      display:inline-flex; align-items:center; justify-content:center;
      pointer-events:auto; cursor:pointer;
      min-width:44px; min-height:44px; padding:0 16px;
      border:1px solid rgba(231,226,216,0.28);
      background:rgba(12,11,8,0.55); color:var(--stone);
      border-radius:999px;
      font-family:'Noto Serif TC', serif; font-size:15px;
    }
    .bottom{
      flex-direction:column; align-items:stretch; justify-content:flex-end; gap:10px;
    }
    .info{
      order:2; width:100%; max-width:100%;
      max-height:min(42dvh, 360px);
      overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
      padding:14px 16px 12px;
      border-radius:18px;
      background:rgba(12,11,8,0.82);
      border:1px solid rgba(231,226,216,0.16);
      pointer-events:auto;
    }
    .info .name{ font-size:clamp(22px, 6.2vw, 32px); }
    .info .latin, .info .summary, .info .specs{ font-size:clamp(13px, 3.4vw, 15px); }
    .info .summary{ max-width:none; }
    .info .price{ font-size:clamp(18px, 5vw, 24px); }
    .info .price-row{ flex-wrap:wrap; gap:10px; }
    .info .action-btn{ min-height:44px; padding:10px 16px; font-size:14px; }
    .picks{
      order:1; display:none;
      flex-direction:row; align-items:center; justify-content:flex-start;
      gap:8px; width:100%; max-width:100%;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:2px;
    }
    body.nav-open .picks{ display:flex; }
    .pick{
      flex:0 0 auto;
      min-height:44px; padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(231,226,216,0.22);
      background:rgba(12,11,8,0.72);
      font-size:14px;
    }
    .pick.active{ transform:none; color:var(--amber); border-color:var(--amber); }
    .hint{
      top:calc(env(safe-area-inset-top, 0px) + 60px);
      bottom:auto;
      max-width:calc(100% - 24px);
      font-size:clamp(10px, 2.8vw, 12px);
    }
    .hint.is-loading span::before{
      content:"";
      display:inline-block;
      width:12px; height:12px; margin-right:8px;
      border-radius:50%;
      border:2px solid rgba(231,226,216,.28);
      border-top-color:var(--amber);
      vertical-align:-1px;
      animation:skelio-spin .8s linear infinite;
    }
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div class="hud">
  <div class="top">
    <a class="back" href="index.html">← ATELIER</a>
    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="dots">標本</button>
    <div class="counter" id="counter">01</div>
  </div>
  <div class="bottom">
    <div class="info" id="info">
      <div class="code" id="infoCode"></div>
      <div class="latin" id="infoLatin"></div>
      <div class="name" id="infoCommon"></div>
      <div class="specs" id="infoSpecs"></div>
      <div class="summary" id="infoSummary"></div>
      <div class="price-row">
        <span class="price" id="infoPrice"></span>
        <button class="action-btn" id="shareSpecimenBtn" type="button">分享標本</button>
      </div>
    </div>
    <div class="picks" id="dots"></div>
  </div>
</div>
<div class="hint is-loading" id="hint"><span>LOADING</span></div>
<script src="specimens.js"></script>
<script>
const hintEl = document.getElementById('hint');
const hintSpan = hintEl ? hintEl.querySelector('span') : null;
function showHint(text, strong){
  if (!hintSpan) return;
  hintSpan.textContent = text;
  if (hintEl){
    hintEl.style.color = strong ? 'var(--stone)' : 'var(--stone-mute)';
    hintEl.classList.toggle('is-loading', text === 'LOADING');
  }
}
function loadFailText(){
  return location.protocol === 'file:' ? '載入失敗 · 請以 Live Server 開啟' : '載入失敗';
}
function boot(){
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function mobileLayout(){
  return window.matchMedia('(max-width: 768px), (max-height: 520px) and (pointer: coarse)').matches;
}
function mobileNow(){
  return mobileLayout() || window.matchMedia('(pointer: coarse)').matches;
}
function pixelCap(){
  return mobileNow() ? 1.25 : 1.5;
}
const specimens = (Array.isArray(SKELIO.tank) ? SKELIO.tank : []).filter(spec => spec && typeof spec.model === 'string' && spec.model);
const N = specimens.length;
let contextLost = false;
let frameId = 0;
if (!N){
  showHint('沒有可展示的模型', true);
  return;
}

const navToggle = document.getElementById('navToggle');
if (navToggle){
  navToggle.addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}
const dotsEl = document.getElementById('dots');
specimens.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'pick' + (i===0 ? ' active' : '');
  b.type = 'button';
  b.textContent = s.name || s.model;
  b.addEventListener('click', () => {
    focusIndex(i);
    if (mobileLayout()){
      document.body.classList.remove('nav-open');
      const toggle = document.getElementById('navToggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    }
  });
  dotsEl.appendChild(b);
});
const dotEls = [...dotsEl.children];

function updateHUD(i){
  const s = specimens[i];
  if (!s) return;
  document.getElementById('counter').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  dotEls.forEach((d,k) => d.classList.toggle('active', k===i));
  const info = document.getElementById('info');
  info.classList.remove('show');
  requestAnimationFrame(() => {
    document.getElementById('infoCode').textContent = s.code ? '#' + s.code : '';
    document.getElementById('infoLatin').textContent = s.latin || '';
    document.getElementById('infoCommon').textContent = s.name || '';
    const specsEl = document.getElementById('infoSpecs');
    if (specsEl) specsEl.textContent = [s.size ? '體長 ' + s.size : '', s.origin || ''].filter(Boolean).join('  ·  ');
    const sumEl = document.getElementById('infoSummary');
    if (sumEl) sumEl.textContent = s.summary || '';
    const priceEl = document.getElementById('infoPrice');
    if (priceEl) priceEl.textContent = typeof s.price === 'number' ? 'NT$ ' + s.price.toLocaleString('en-US') : '';
    requestAnimationFrame(() => info.classList.add('show'));
  });
}
updateHUD(0);
const shareBtn = document.getElementById('shareSpecimenBtn');
if (shareBtn){
  shareBtn.addEventListener('click', () => {
    const cur = specimens[active] || specimens[0];
    if (!cur) return;
    const url = new URL('showcase.html?id=' + encodeURIComponent(cur.code || cur.name || ''), location.href).href;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.textContent = '已複製連結';
        setTimeout(() => { shareBtn.textContent = '分享標本'; }, 1500);
      }).catch(() => {});
    }
  });
}

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c0b08, 0.045);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 80);
camera.position.set(0, 1.4, 11);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !mobileNow() });
} catch (err) {
  console.error('WebGL 初始化失敗', err);
  showHint('此瀏覽器不支援 WebGL', true);
  return;
}
if (mobileNow() && renderer.shadowMap) renderer.shadowMap.enabled = false;
renderer.setClearColor(0x0c0b08, 1);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = 'none';
function fitRenderer(){
  const w = wrap.clientWidth || innerWidth;
  const h = wrap.clientHeight || innerHeight || 1;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, pixelCap()));
  if (mobileNow() && renderer.shadowMap) renderer.shadowMap.enabled = false;
  renderer.setSize(w, h, false);
}
fitRenderer();
requestAnimationFrame(fitRenderer);
renderer.domElement.addEventListener('webglcontextlost', (event) => {
  event.preventDefault();
  contextLost = true;
  cancelAnimationFrame(frameId);
  showHint('顯示中斷', true);
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
  contextLost = false;
  if (hintSpan && hintSpan.textContent === '顯示中斷') showHint('DRAG  ·  SCROLL', false);
  cancelAnimationFrame(frameId);
  frameId = requestAnimationFrame(tick);
});

scene.add(new THREE.AmbientLight(0xd8e0ce, 0.65));
scene.add(new THREE.HemisphereLight(0xfff8ee, 0x3a4234, 0.72));
const key = new THREE.DirectionalLight(0xfff1d2, 0.85);
key.position.set(4, 8, 6);
scene.add(key);
const fill = new THREE.PointLight(0x7d8a68, 0.55, 28);
fill.position.set(-3, 2, 2);
scene.add(fill);
const rim = new THREE.PointLight(0xffe3b0, 0.7, 18);
camera.add(rim);
rim.position.set(0.4, 0.2, 1);
scene.add(camera);

const scTexLoader = new THREE.TextureLoader();
const canLoadScTex = (typeof location !== 'undefined' && location.protocol !== 'file:');
function loadScTex(url, rep, isColor, onDone){
  if (!canLoadScTex) return null;
  const t = scTexLoader.load(url, (loaded) => {
    if (onDone) onDone(loaded);
  });
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  if (isColor) t.encoding = THREE.sRGBEncoding;
  return t;
}

const groundMat = new THREE.MeshStandardMaterial({
  color: 0x5c6e4e,
  bumpScale: 0.02,
  roughness: 0.95,
  metalness: 0.02
});
loadScTex('textures/Moss002/Moss002_4K-JPG_Color.jpg', 4, true, (tex) => {
  groundMat.color.setHex(0xffffff);
  groundMat.map = tex;
  groundMat.needsUpdate = true;
});
loadScTex('textures/Moss002/Moss002_4K-JPG_NormalGL.jpg', 4, false, (tex) => {
  groundMat.normalMap = tex;
  groundMat.needsUpdate = true;
});
loadScTex('textures/Moss002/Moss002_4K-JPG_Roughness.jpg', 4, false, (tex) => {
  groundMat.roughnessMap = tex;
  groundMat.needsUpdate = true;
});
loadScTex('textures/Ground054/Ground054_4K-JPG_Roughness.jpg', 4, false, (tex) => {
  groundMat.bumpMap = tex;
  groundMat.needsUpdate = true;
});

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9.5, 64),
  groundMat
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.70;
scene.add(ground);

// 已移除 addLeaf 背景深色剪影幾何體，保持生態缸單品舞台純淨

const scGlassMat = new THREE.MeshPhysicalMaterial({
  color:0xdde8d4, transparent:true, opacity:0.09,
  roughness:0.18,
  normalScale:new THREE.Vector2(0.08, 0.08),
  metalness:0, transmission:0.6, thickness:0.4,
  side:THREE.DoubleSide
});
loadScTex('textures/SurfaceImperfections003/SurfaceImperfections003_4K-JPG_Color.jpg', 2, false, (tex) => {
  scGlassMat.roughnessMap = tex;
  scGlassMat.needsUpdate = true;
});
loadScTex('textures/SurfaceImperfections003/SurfaceImperfections003_4K-JPG_NormalGL.jpg', 2, false, (tex) => {
  scGlassMat.normalMap = tex;
  scGlassMat.needsUpdate = true;
});
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(14, 7.2, 11),
  scGlassMat
);
glass.position.y = 0.7;
glass.name = 'glass';
scene.add(glass);

function makeScSilverEnv(){
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(10, 32, 16);
  const cols = [];
  const pos = envGeo.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const t = THREE.MathUtils.clamp((pos.getY(i) / 10) * 0.5 + 0.5, 0, 1);
    const c = new THREE.Color(0x3a3f44).lerp(new THREE.Color(0xf4f6f8), Math.pow(t, 0.8));
    cols.push(c.r, c.g, c.b);
  }
  envGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  envGeo.dispose();
  return rt.texture;
}
const scSilverMat = new THREE.MeshStandardMaterial({
  name: 'metal',
  color: 0xd9dde2,
  roughness: 0.16,
  metalness: 1.0,
  envMap: makeScSilverEnv(),
  envMapIntensity: 1.0,
  side: THREE.DoubleSide
});
if (canLoadScTex){
  loadScTex('textures/Metal049A/Metal049A_4K-JPG_Color.jpg', 1.5, true, (tex) => {
    scSilverMat.map = tex;
    scSilverMat.needsUpdate = true;
  });
  loadScTex('textures/Metal049A/Metal049A_4K-JPG_NormalGL.jpg', 1.5, false, (tex) => {
    scSilverMat.normalMap = tex;
    scSilverMat.needsUpdate = true;
  });
  loadScTex('textures/Metal049A/Metal049A_4K-JPG_Roughness.jpg', 1.5, false, (tex) => {
    scSilverMat.roughnessMap = tex;
    scSilverMat.needsUpdate = true;
  });
  loadScTex('textures/Metal049A/Metal049A_4K-JPG_Metalness.jpg', 1.5, false, (tex) => {
    scSilverMat.metalnessMap = tex;
    scSilverMat.needsUpdate = true;
  });
}
const glassBottom = glass.position.y - 3.6;
const standH = 0.46;
const tankStand = new THREE.Mesh(new THREE.BoxGeometry(14.4, standH, 11.4), scSilverMat);
tankStand.name = '生態缸底座';
tankStand.position.y = glassBottom - standH / 2;
scene.add(tankStand);

const moteGeo = new THREE.BufferGeometry();
const moteCount = 90;
const motePos = new Float32Array(moteCount * 3);
for (let i = 0; i < moteCount; i++){
  motePos[i*3] = (Math.random()-0.5)*12;
  motePos[i*3+1] = Math.random()*5 - 1.6;
  motePos[i*3+2] = (Math.random()-0.5)*9;
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
  color:0xe7e2d8, size:0.035, transparent:true, opacity:0.35
}));
scene.add(motes);

const groundY = -1.70;
const poses = [
  { x: 0.0, y:  0.55, z: 0.0 },
  { x: 0.0, y: -0.65, z: 0.0 },
  { x: 0.0, y:  0.35, z: 0.0 },
];

const insects = new Array(N);
const pointer = new THREE.Vector2();
let active = 0;
let mode = 'inspect';
const camPos = new THREE.Vector3(0, 0.35, 6.4);
const camAim = new THREE.Vector3(0, -0.35, 0);
const introFrom = new THREE.Vector3(0, 1.6, 12);
const gltfLoader = new THREE.GLTFLoader();
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
gltfLoader.setDRACOLoader(dracoLoader);
const silverMeshNames = ['生態缸底座'];
function shellPartForBox(meshBox, tankBox){
  const s = new THREE.Vector3();
  const c = new THREE.Vector3();
  meshBox.getSize(s);
  meshBox.getCenter(c);
  const tankSize = new THREE.Vector3();
  tankBox.getSize(tankSize);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  const ny = (c.y - tankBox.min.y) / Math.max(tankSize.y, 1e-6);
  if (meshBox.min.y <= tankBox.min.y + tankSize.y * 0.04 && s.x > tankSize.x * 0.62 && s.z > tankSize.z * 0.62 && s.y < tankSize.y * 0.45) return 'base';
  const onTop = meshBox.max.y >= tankBox.max.y - tankSize.y * 0.06;
  const wideCap = s.x > tankSize.x * 0.65 && s.z > tankSize.z * 0.7;
  const flat = s.y < tankSize.y * 0.14;
  if ((onTop || ny > 0.88) && wideCap && flat) return 'lid';
  const slender = dims[0] < tankSize.y * 0.05 && (dims[0] / Math.max(dims[2], 1e-6)) < 0.12 && dims[2] > tankSize.x * 0.3;
  const margin = 0.03;
  const onShell = meshBox.min.x <= tankBox.min.x + tankSize.x * margin || meshBox.max.x >= tankBox.max.x - tankSize.x * margin ||
    meshBox.min.y <= tankBox.min.y + tankSize.y * margin || meshBox.max.y >= tankBox.max.y - tankSize.y * margin ||
    meshBox.min.z <= tankBox.min.z + tankSize.z * margin || meshBox.max.z >= tankBox.max.z - tankSize.z * margin;
  if (slender && onShell) return 'frame';
  return null;
}
function panelLikeSc(mesh){
  const geo = mesh.geometry;
  if (!geo) return false;
  if (!geo.boundingBox) geo.computeBoundingBox();
  if (!geo.boundingBox) return false;
  const s = new THREE.Vector3();
  geo.boundingBox.getSize(s);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  return (dims[0] < dims[2] * 0.045 && dims[2] > 0.08) || (dims[0] < 0.012 && dims[1] > 0.15 && dims[2] > 0.15);
}
gltfLoader.load('models/' + encodeURIComponent('生態箱.glb') + '?v=2', (gltf) => {
  if (!gltf || !gltf.scene) return;
  const obj = gltf.scene;
  obj.updateMatrixWorld(true);
  const tankBox = new THREE.Box3().setFromObject(obj);
  obj.traverse(o => {
    if (!o.isMesh) return;
    const meshBox = new THREE.Box3().setFromObject(o);
    const size = new THREE.Vector3();
    meshBox.getSize(size);
    const dims = [size.x, size.y, size.z].sort((a, b) => a - b);
    const thinRatio = dims[0] / Math.max(dims[2], 1e-6);
    if (panelLikeSc(o) || thinRatio < 0.045) return;
    const part = shellPartForBox(meshBox, tankBox);
    if (part !== 'base' && part !== 'lid' && part !== 'frame') return;
    o.material = scSilverMat;
    o.userData.part = part;
    silverMeshNames.push(o.name || part);
  });
  window.SKELIO_SILVER_MESHES = silverMeshNames.slice();
  console.log('拋光銀外殼', window.SKELIO_SILVER_MESHES);
  const holder = new THREE.Group();
  const taken = [];
  obj.traverse(o => {
    if (o.isMesh && o.userData.part && (o.userData.part === 'base' || o.userData.part === 'lid' || o.userData.part === 'frame')) taken.push(o);
  });
  obj.updateMatrixWorld(true);
  taken.forEach(o => holder.attach(o));
  scene.add(holder);
  const hb = new THREE.Box3().setFromObject(holder);
  const hc = new THREE.Vector3();
  const hs = new THREE.Vector3();
  hb.getCenter(hc);
  hb.getSize(hs);
  const targetH = 3.4;
  const scScale = targetH / (hs.y || 1);
  holder.scale.setScalar(scScale);
  holder.position.set(-hc.x * scScale, groundY - hb.min.y * scScale, -2.8 - hc.z * scScale);
}, undefined, (err) => {
  console.error('生態箱底座載入失敗', err);
  window.SKELIO_SILVER_MESHES = silverMeshNames.slice();
});

function prepareModel(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  obj.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  obj.scale.setScalar(2.8 / maxDim);
  obj.updateMatrixWorld(true);
  const fitted = new THREE.Box3().setFromObject(obj);
  obj.position.y -= fitted.min.y;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    mats.forEach(m => {
      if (typeof m.metalness === 'number' && m.metalness > 0.38) m.metalness = 0.38;
      if (typeof m.roughness === 'number' && m.roughness < 0.30) m.roughness = 0.30;
    });
  });
  const group = new THREE.Group();
  group.add(obj);
  return group;
}

function loadModel(spec){
  if (!spec || typeof spec.model !== 'string' || !spec.model){
    return Promise.reject(new Error('缺少模型'));
  }
  const url = 'models/' + encodeURIComponent(spec.model) + '?v=2';
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, (gltf) => {
      try {
        if (!gltf || !gltf.scene) throw new Error('模型是空的');
        resolve(prepareModel(gltf.scene));
      } catch (err) {
        reject(err);
      }
    }, undefined, reject);
  });
}

function seat(group){
  group.position.set(0, 0, 0);
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  const center = new THREE.Vector3();
  box.getCenter(center);
  group.position.x -= center.x;
  group.position.z -= center.z;
  group.position.y = groundY - box.min.y;
  group.updateMatrixWorld(true);
  // Iterative verification to guarantee zero gap (< 0.001) on ground disc at groundY
  for (let iter = 0; iter < 3; iter++){
    const checkBox = new THREE.Box3().setFromObject(group);
    const gap = checkBox.min.y - groundY;
    if (Math.abs(gap) <= 0.0005) break;
    group.position.y -= gap;
    group.updateMatrixWorld(true);
  }
  return group.position.y;
}

const inflight = new Array(N);
function ensure(i, quiet){
  if (insects[i]) return Promise.resolve(insects[i]);
  if (inflight[i]) return inflight[i];
  const spec = specimens[i];
  if (!quiet) showHint('LOADING', false);
  const job = loadModel(spec).then(group => {
    if (insects[i]) return insects[i];
    const pose = poses[i] || poses[0];
    group.rotation.set(pose.x, pose.y, pose.z);
    const restY = seat(group);
    group.userData.index = i;
    group.visible = i === active;
    scene.add(group);
    insects[i] = { mesh: group, restY, seed: i * 1.7 };
    return insects[i];
  }).catch(err => {
    inflight[i] = null;
    throw err;
  });
  inflight[i] = job;
  return job;
}

function showOnly(i){
  insects.forEach((it, k) => { if (it) it.mesh.visible = k === i; });
}

function focusIndex(i, unknown){
  if (!N) return Promise.resolve();
  const index = ((i % N) + N) % N;
  active = index;
  mode = 'inspect';
  updateHUD(index);
  return ensure(index).then(() => {
    if (active !== index) return;
    showOnly(index);
    if (unknown) showHint('找不到此標本', true);
    else showHint('DRAG  ·  SCROLL', false);
    specimens.forEach((_, k) => {
      if (k !== index) ensure(k, true).catch(err => console.error('預載失敗', err));
    });
  }).catch((err) => {
    if (active !== index) return;
    console.error('模型載入失敗', err);
    showHint(loadFailText(), true);
  });
}

function specimenKey(){
  let key = '';
  try {
    const params = new URLSearchParams(location.search);
    key = params.get('id') || params.get('code') || '';
  } catch (err) {
    key = '';
  }
  if (!key && location.hash.length > 1){
    try { key = decodeURIComponent(location.hash.slice(1)); }
    catch (err) { key = location.hash.slice(1); }
  }
  return key;
}
const requestKey = specimenKey();
let startIdx = 0;
let unknownSpecimen = false;
if (requestKey){
  const found = specimens.findIndex(s => s && (s.code === requestKey || s.name === requestKey));
  if (found < 0) unknownSpecimen = true;
  else startIdx = found;
}
focusIndex(startIdx, unknownSpecimen);

let orbitY = 0.35, orbitX = 0.22;
let targetY = 0.35, targetX = 0.22;
let velY = 0, velX = 0;
let dragging = false;
let moved = false;
let lastPX = 0, lastPY = 0;
let gestureDx = 0, gestureDy = 0;
let orbitAtDownY = 0.35, orbitAtDownX = 0.22;
let wheelLock = 0;

wrap.style.touchAction = 'none';
wrap.addEventListener('pointerdown', (e) => {
  dragging = true;
  moved = false;
  gestureDx = 0;
  gestureDy = 0;
  orbitAtDownY = targetY;
  orbitAtDownX = targetX;
  lastPX = e.clientX;
  lastPY = e.clientY;
  velY = 0;
  velX = 0;
  wrap.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
wrap.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  if (!dragging) return;
  const dx = e.clientX - lastPX;
  const dy = e.clientY - lastPY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  lastPX = e.clientX;
  lastPY = e.clientY;
  gestureDx += dx;
  gestureDy += dy;
  if (mobileLayout() && Math.abs(gestureDx) > Math.abs(gestureDy)){
    targetY = orbitAtDownY;
    targetX = orbitAtDownX;
    velY = 0;
    velX = 0;
    return;
  }
  targetY += dx * 0.005;
  targetX = Math.max(-0.15, Math.min(0.7, targetX + dy * 0.003));
  velY = dx * 0.005;
  velX = dy * 0.003;
});
function endDrag(){
  if (mobileLayout() && moved && Math.abs(gestureDx) > 48 && Math.abs(gestureDx) > Math.abs(gestureDy)){
    focusIndex(active + (gestureDx < 0 ? 1 : -1));
  }
  dragging = false;
  document.body.classList.remove('dragging');
}
wrap.addEventListener('pointerup', endDrag);
wrap.addEventListener('pointercancel', endDrag);

window.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (performance.now() < wheelLock) return;
  if (Math.abs(e.deltaY) < 12) return;
  wheelLock = performance.now() + 700;
  focusIndex(active + (e.deltaY > 0 ? 1 : -1));
}, { passive:false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') focusIndex(active + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') focusIndex(active - 1);
});

let t0 = performance.now();
function tick(now){
  frameId = requestAnimationFrame(tick);
  if (contextLost) return;
  const t = (now - t0) / 1000;
  if (!dragging && !reduceMotion){
    targetY += velY;
    targetX = Math.max(-0.15, Math.min(0.7, targetX + velX));
    velY *= 0.92;
    velX *= 0.92;
  }
  const follow = reduceMotion ? 1 : 0.08;
  orbitY += (targetY - orbitY) * follow;
  orbitX += (targetX - orbitX) * follow;

  const current = insects[active];
  if (current){
    current.mesh.position.y = current.restY + Math.sin(t * 0.55 + current.seed) * 0.012;
  }

  const moteArr = motes.geometry.attributes.position.array;
  for (let i = 1; i < moteArr.length; i += 3){
    moteArr[i] += 0.004;
    if (moteArr[i] > 3.8) moteArr[i] = -1.8;
  }
  motes.geometry.attributes.position.needsUpdate = true;

  const dist = 5.4;
  camPos.set(Math.sin(orbitY) * dist, 0.15 + orbitX * 1.6, Math.cos(orbitY) * dist);
  camAim.set(0, -0.45, 0);

  const intro = reduceMotion ? 1 : Math.min(1, t / 2.4);
  const eased = 1 - Math.pow(1-intro, 3);
  camera.position.lerpVectors(introFrom, camPos, eased);
  const look = new THREE.Vector3().lerpVectors(new THREE.Vector3(0,0.2,0), camAim, eased);
  camera.lookAt(look);

  try {
    renderer.render(scene, camera);
  } catch (err) {
    contextLost = true;
    cancelAnimationFrame(frameId);
    console.error('畫面更新中斷', err);
    showHint('畫面更新中斷', true);
    return;
  }
}
frameId = requestAnimationFrame(tick);

window.addEventListener('resize', fitRenderer);
}

if (!window.THREE || !THREE.GLTFLoader || !THREE.WebGLRenderer){
  showHint('3D 程式庫載入失敗', true);
} else if (!window.SKELIO || !Array.isArray(SKELIO.tank)){
  showHint('標本資料載入失敗', true);
} else {
  if (location.protocol === 'file:') showHint('請以 Live Server 開啟，否則無法載入模型', true);
  boot();
}
</script>
