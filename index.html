<!DOCTYPE html>
<!-- 注意：請用本機伺服器開啟（例如 Cursor 的 Live Server 擴充功能），不要直接雙擊 HTML 檔，否則瀏覽器會封鎖從 file:// 載入 .glb 模型。 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素樞 SKELIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{ --ink:#1c1b18; --paper:#f6f5f2; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--paper); color:var(--ink); overflow:hidden; }
  body{ font-family:'Noto Serif TC', serif; }
  canvas{ display:block; cursor:pointer; }
  body.inside canvas{ cursor:grab; }
  body.inside.dragging canvas{ cursor:grabbing; }
  .mark{
    position:fixed; top:28px; left:36px; z-index:2;
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.32em;
    opacity:.45; pointer-events:none;
  }
  .open{
    position:fixed; left:50%; bottom:7vh; transform:translateX(-50%);
    z-index:2; border:0; background:transparent; color:var(--ink);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.42em;
    cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity .6s ease;
  }
  .open.ready{ opacity:.72; pointer-events:auto; }
  .open span{
    display:block; width:1px; height:36px; margin:14px auto 0; background:var(--ink); opacity:.35;
    position:relative; overflow:hidden;
  }
  .open span::after{
    content:''; position:absolute; left:0; top:-100%; width:100%; height:100%;
    background:var(--ink); animation:drip 1.8s ease-in-out infinite;
  }
  @keyframes drip{ 0%{ top:-100%; } 70%{ top:100%; } 100%{ top:100%; } }
  .status{
    position:fixed; left:36px; bottom:28px; z-index:2;
    font-family:'Cinzel', serif; font-size:10px; letter-spacing:.28em; opacity:0;
    transition:opacity .6s ease; pointer-events:none;
  }
  .status.on{ opacity:.45; }
  body.inside .open{ opacity:0; pointer-events:none; transition:opacity .6s ease; }
  @media (prefers-reduced-motion: reduce){
    .open span::after{ animation:none; }
  }
</style>
</head>
<body>
<div class="mark">SKELIO</div>
<button class="open" id="open" type="button">OPEN<span></span></button>
<div class="status" id="status"></div>
<script src="specimens.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const beetles = SKELIO.tank;
let seats = [];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f5f2);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.2, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xfff8ee, 0.9);
key.position.set(3, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xe7ece4, 0.45);
fill.position.set(-4, 2, -2);
scene.add(fill);

const loader = new THREE.GLTFLoader();
const statusEl = document.getElementById('status');
let boxMesh = null;
let boxSize = new THREE.Vector3(1, 1, 1);
let phase = 'loading';
let enterStart = 0;
const coverPos = new THREE.Vector3();
const insidePos = new THREE.Vector3();
const lookCover = new THREE.Vector3();
const lookInside = new THREE.Vector3();
let yaw = 0, pitch = -0.2, targetYaw = 0, targetPitch = -0.2;
let zoom = 1, targetZoom = 1;
const zoomMin = 0.26, zoomMax = 1.65;
const focus = new THREE.Vector3();
let dragging = false, lastX = 0, lastY = 0, velYaw = 0;

function loadGLB(file){
  return new Promise((resolve, reject) => {
    loader.load('models/' + encodeURIComponent(file), resolve, undefined, reject);
  });
}

function fitCreature(obj, target){
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fitted = target / maxDim;
  obj.scale.setScalar(fitted);
  obj.position.copy(center).multiplyScalar(-fitted);
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    o.castShadow = false;
    o.material.polygonOffset = true;
    o.material.polygonOffsetFactor = -1;
    o.material.polygonOffsetUnits = -1;
  });
  const g = new THREE.Group();
  g.add(obj);
  g.userData.belly = size.y * fitted * 0.5;
  g.userData.longAxis = size.x >= size.z ? 'x' : 'z';
  return g;
}

function collectSeats(root){
  root.updateMatrixWorld(true);
  const best = new Map();
  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const e1 = new THREE.Vector3();
  const e2 = new THREE.Vector3();
  const n = new THREE.Vector3();
  const mid = new THREE.Vector3();
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  root.traverse(mesh => {
    if (!mesh.isMesh || mesh.material === glassMat || !mesh.geometry) return;
    const box = new THREE.Box3().setFromObject(mesh);
    box.getSize(size);
    box.getCenter(center);
    const longest = Math.max(size.x, size.y, size.z);
    if (longest < boxSize.y * 0.12) return;
    const axis = new THREE.Vector3(1, 0, 0);
    if (size.y >= size.x && size.y >= size.z) axis.set(0, 1, 0);
    else if (size.z >= size.x && size.z >= size.y) axis.set(0, 0, 1);
    const pos = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const triCount = index ? index.count / 3 : pos.count / 3;
    const step = Math.max(1, Math.floor(triCount / 160));
    for (let t = 0; t < triCount; t += step){
      const i0 = index ? index.getX(t * 3) : t * 3;
      const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
      const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;
      vA.fromBufferAttribute(pos, i0).applyMatrix4(mesh.matrixWorld);
      vB.fromBufferAttribute(pos, i1).applyMatrix4(mesh.matrixWorld);
      vC.fromBufferAttribute(pos, i2).applyMatrix4(mesh.matrixWorld);
      e1.subVectors(vB, vA);
      e2.subVectors(vC, vA);
      n.crossVectors(e1, e2);
      const area = n.length() * 0.5;
      if (area < 2e-5) continue;
      n.multiplyScalar(1 / (area * 2));
      const span = Math.max(e1.length(), e2.length(), vB.distanceTo(vC));
      const altitude = span > 1e-6 ? (area * 2) / span : 0;
      if (altitude < span * 0.12) continue;
      mid.copy(vA).add(vB).add(vC).multiplyScalar(1 / 3);
      const outward = e1.copy(mid).sub(center);
      if (outward.lengthSq() > 1e-4 && n.dot(outward) < -0.15 * outward.length()) n.negate();
      if (n.y < 0.18 || n.z < 0.12) continue;
      if (mid.y < boxSize.y * 0.2 || mid.y > boxSize.y * 0.9) continue;
      if (Math.abs(mid.x) > boxSize.x * 0.4 || Math.abs(mid.z) > boxSize.z * 0.36) continue;
      const tangent = axis.clone().addScaledVector(n, -axis.dot(n));
      if (tangent.lengthSq() < 1e-6) continue;
      tangent.normalize();
      const score = Math.sqrt(area) * (0.4 + (1 - Math.abs(n.y - 0.62)));
      const list = best.get(mesh.uuid) || [];
      list.push({
        point: mid.clone(),
        normal: n.clone(),
        tangent: tangent.clone(),
        score: score,
        mesh: mesh
      });
      if (list.length > 10){
        list.sort((a, b) => b.score - a.score);
        list.length = 8;
      }
      best.set(mesh.uuid, list);
    }
  });
  const pools = Array.from(best.values()).map(list => list.sort((a, b) => b.score - a.score));
  pools.sort((a, b) => b[0].score - a[0].score);
  const raycaster = new THREE.Raycaster();
  raycaster.near = 0.01;
  raycaster.far = 0.4;
  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();
  const side = new THREE.Vector3();
  const reach = boxSize.y * 0.045;
  function grounded(seat){
    side.crossVectors(seat.normal, seat.tangent).normalize();
    dir.copy(seat.normal).negate();
    const checks = [[0, 0], [reach, 0], [-reach, 0], [0, reach * 0.55], [0, -reach * 0.55]];
    for (let i = 0; i < checks.length; i++){
      origin.copy(seat.point)
        .addScaledVector(seat.tangent, checks[i][0])
        .addScaledVector(side, checks[i][1])
        .addScaledVector(seat.normal, 0.18);
      raycaster.set(origin, dir);
      if (!raycaster.intersectObject(seat.mesh, false).length) return false;
    }
    return true;
  }
  const chosen = [];
  function take(requireGround, maxFlat, gap){
    let flats = chosen.filter(s => s.normal.y > 0.82).length;
    pools.forEach(list => {
      if (chosen.length >= beetles.length) return;
      const seat = list.find(s => !chosen.includes(s)
        && chosen.every(c => c.point.distanceTo(s.point) > gap)
        && !(s.normal.y > 0.82 && flats >= maxFlat)
        && (!requireGround || grounded(s)));
      if (!seat) return;
      chosen.push(seat);
      if (seat.normal.y > 0.82) flats += 1;
    });
  }
  const wide = boxSize.x * 0.16;
  take(true, Math.ceil(beetles.length / 3), wide);
  if (chosen.length < beetles.length) take(true, beetles.length, boxSize.x * 0.1);
  if (chosen.length < beetles.length) take(false, beetles.length, boxSize.x * 0.08);
  return chosen.slice(0, beetles.length);
}

const sitX = new THREE.Vector3();
const sitZ = new THREE.Vector3();
const sitM = new THREE.Matrix4();
function sitOn(group, seat){
  if (group.userData.longAxis === 'z'){
    sitX.crossVectors(seat.normal, seat.tangent).normalize();
    sitZ.crossVectors(sitX, seat.normal).normalize();
  } else {
    sitX.copy(seat.tangent);
    sitZ.crossVectors(seat.normal, sitX).normalize();
    sitX.crossVectors(sitZ, seat.normal).normalize();
  }
  sitM.makeBasis(sitX, seat.normal, sitZ);
  group.quaternion.setFromRotationMatrix(sitM);
  group.position.copy(seat.point).addScaledVector(seat.normal, group.userData.belly);
}

const glassMat = new THREE.MeshStandardMaterial({
  color: 0xe7f1ea,
  transparent: true,
  opacity: 0.16,
  roughness: 0.04,
  metalness: 0,
  depthWrite: false,
  side: THREE.DoubleSide
});

function panelLike(mesh){
  const geo = mesh.geometry;
  if (!geo.boundingBox) geo.computeBoundingBox();
  const s = new THREE.Vector3();
  geo.boundingBox.getSize(s);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  return dims[0] < dims[2] * 0.045 && dims[2] > 0.08;
}

loadGLB('生態箱.glb').then((gltf) => {
  const obj = gltf.scene;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    if (panelLike(o)){
      o.material = glassMat;
      o.renderOrder = 2;
    } else if (o.material){
      o.material.side = THREE.DoubleSide;
    }
  });
  const bounds = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  bounds.getSize(size);
  bounds.getCenter(center);
  obj.position.sub(center);
  const wrap = new THREE.Group();
  wrap.add(obj);
  const height = 3.6;
  const s = height / size.y;
  wrap.scale.setScalar(s);
  wrap.position.y = height / 2;
  scene.add(wrap);
  boxMesh = wrap;
  boxSize.set(size.x * s, height, size.z * s);

  const front = boxSize.z * 0.5;
  coverPos.set(0, boxSize.y * 0.5, front + boxSize.y * 1.65);
  insidePos.set(0, boxSize.y * 0.55, front + boxSize.y * 1.35);
  lookCover.set(0, boxSize.y * 0.46, 0);
  lookInside.set(0, boxSize.y * 0.44, -boxSize.z * 0.08);
  focus.set(0, boxSize.y * 0.46, 0);
  const aim = new THREE.Vector3().subVectors(lookInside, insidePos);
  targetPitch = pitch = Math.atan2(aim.y, Math.hypot(aim.x, aim.z));
  camera.position.copy(coverPos);
  camera.lookAt(lookCover);
  seats = collectSeats(wrap);
  phase = 'cover';
  document.getElementById('open').classList.add('ready');
}).catch((err) => {
  console.error('生態箱模型載入失敗', err);
  statusEl.textContent = '載入失敗';
  statusEl.classList.add('on');
});

function placeBeetles(){
  const target = boxSize.y * 0.12;
  statusEl.textContent = 'LOADING';
  statusEl.classList.add('on');
  return Promise.all(beetles.map((spec, i) => loadGLB(spec.model).then((gltf) => {
    const g = fitCreature(gltf.scene, target);
    const seat = seats[i] || seats[0];
    if (seat) sitOn(g, seat);
    scene.add(g);
    statusEl.textContent = 'LOADING  ' + (i + 1) + ' / ' + beetles.length;
  }))).then(() => {
    statusEl.textContent = 'DRAG · SCROLL';
    setTimeout(() => statusEl.classList.remove('on'), 1600);
  }).catch((err) => {
    console.error('甲蟲模型載入失敗', err);
    statusEl.textContent = '載入失敗';
    statusEl.classList.add('on');
  });
}

function openBox(){
  if (phase !== 'cover') return;
  phase = 'entering';
  enterStart = performance.now();
  document.body.classList.add('inside');
  placeBeetles();
}

document.getElementById('open').addEventListener('click', openBox);
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (phase === 'cover'){ openBox(); return; }
  if (phase !== 'inside') return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  velYaw = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  targetYaw -= dx * 0.005;
  targetPitch = Math.max(-0.35, Math.min(0.28, targetPitch + dy * 0.003));
  velYaw = -dx * 0.005;
});
function endDrag(){
  dragging = false;
  document.body.classList.remove('dragging');
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

renderer.domElement.addEventListener('wheel', (e) => {
  if (phase !== 'inside') return;
  e.preventDefault();
  const line = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  const step = Math.max(-0.12, Math.min(0.12, e.deltaY * line * 0.0011));
  targetZoom = Math.max(zoomMin, Math.min(zoomMax, targetZoom + step));
}, { passive: false });

const camNow = new THREE.Vector3();
const lookNow = new THREE.Vector3();
const viewDir = new THREE.Vector3();
const insideTone = new THREE.Color(0xe7e3da);
const coverFov = 32;
const insideFov = 48;

function lookFromEye(){
  const cy = Math.cos(pitch);
  viewDir.set(Math.sin(yaw) * cy, Math.sin(pitch), -Math.cos(yaw) * cy);
  lookNow.copy(camera.position).add(viewDir);
  camera.lookAt(lookNow);
}

let t0 = performance.now();
function tick(now){
  const t = (now - t0) / 1000;
  if (boxMesh && phase === 'cover' && !reduce){
    boxMesh.rotation.y = 0.42 + Math.sin(t * 0.35) * 0.06;
  }
  if (phase === 'entering'){
    const u = Math.min(1, (now - enterStart) / (reduce ? 1 : 1700));
    const e = u * u * (3 - 2 * u);
    camNow.lerpVectors(coverPos, insidePos, e);
    lookNow.lerpVectors(lookCover, lookInside, e);
    camera.position.copy(camNow);
    camera.lookAt(lookNow);
    camera.fov = coverFov + (insideFov - coverFov) * e;
    camera.updateProjectionMatrix();
    if (boxMesh) boxMesh.rotation.y += (0 - boxMesh.rotation.y) * 0.08;
    scene.background.lerp(insideTone, 0.04);
    if (u >= 1) phase = 'inside';
  }
  if (phase === 'inside'){
    if (!dragging && !reduce) targetYaw += velYaw;
    velYaw *= 0.92;
    const k = reduce ? 1 : 0.08;
    yaw += (targetYaw - yaw) * k;
    pitch += (targetPitch - pitch) * k;
    zoom += (targetZoom - zoom) * (reduce ? 1 : 0.14);
    camNow.copy(insidePos).sub(focus).multiplyScalar(zoom).add(focus);
    camera.position.copy(camNow);
    lookFromEye();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick(t0);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
