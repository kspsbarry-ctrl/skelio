<style>
  :root{
    --ink:#1c1b18;
    --ink-secondary:#4a4740;
    --paper:#f6f5f2;
    --mute:#57534c;
    --accent:#8b6229;
    --glass-bg:rgba(252,251,248,0.86);
    --glass-border:rgba(28,27,24,0.12);
    --frame-top:56px;
    --frame-right:48px;
    --frame-bottom:52px;
    --frame-left:48px;
    --frame-lip:9px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ min-height:100%; background:var(--paper); color:var(--ink); overflow-x:hidden; overflow-y:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar{ display:none; }
  html.inside{ overflow-y:auto; }
  html.inside body{ overflow-y:visible; }
  body{ font-family:'Noto Serif TC', serif; }
  canvas{ position:fixed; inset:0; z-index:1; display:block; cursor:pointer; touch-action:none; width:100%; height:100%; max-width:100%; }
  .scroll-track{
    position:relative; width:1px; height:100vh; pointer-events:none; z-index:0;
  }
  body.inside .scroll-track{ height:560vh; }
  body.inside canvas{ cursor:grab; }
  body.inside.dragging canvas{ cursor:grabbing; }
  .view-frame{
    position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden;
  }
  .view-mount, .view-lip, .view-bore{ position:absolute; }
  .view-mount-t{
    top:0; left:0; right:0; height:var(--frame-top);
    background:linear-gradient(#f8f7f4, #e6e2da);
  }
  .view-mount-b{
    bottom:0; left:0; right:0; height:var(--frame-bottom);
    background:linear-gradient(#d8d3ca, #f4f2ed);
  }
  .view-mount-l{
    top:0; bottom:0; left:0; width:var(--frame-left);
    background:linear-gradient(90deg, #f7f6f3, #e4e0d8);
  }
  .view-mount-r{
    top:0; bottom:0; right:0; width:var(--frame-right);
    background:linear-gradient(90deg, #d4cfc6, #f5f3ee);
  }
  .view-lip-t{
    top:calc(var(--frame-top) - var(--frame-lip));
    left:calc(var(--frame-left) - var(--frame-lip));
    right:calc(var(--frame-right) - var(--frame-lip));
    height:var(--frame-lip);
    background:linear-gradient(#f7f8f9, #8d939a);
    clip-path:polygon(0 0, 100% 0, calc(100% - var(--frame-lip)) 100%, var(--frame-lip) 100%);
  }
  .view-lip-b{
    bottom:calc(var(--frame-bottom) - var(--frame-lip));
    left:calc(var(--frame-left) - var(--frame-lip));
    right:calc(var(--frame-right) - var(--frame-lip));
    height:var(--frame-lip);
    background:linear-gradient(#6e747b, #e7eaee);
    clip-path:polygon(var(--frame-lip) 0, calc(100% - var(--frame-lip)) 0, 100% 100%, 0 100%);
  }
  .view-lip-l{
    top:calc(var(--frame-top) - var(--frame-lip));
    bottom:calc(var(--frame-bottom) - var(--frame-lip));
    left:calc(var(--frame-left) - var(--frame-lip));
    width:var(--frame-lip);
    background:linear-gradient(90deg, #f4f6f8, #9aa0a6);
    clip-path:polygon(0 0, 100% var(--frame-lip), 100% calc(100% - var(--frame-lip)), 0 100%);
  }
  .view-lip-r{
    top:calc(var(--frame-top) - var(--frame-lip));
    bottom:calc(var(--frame-bottom) - var(--frame-lip));
    right:calc(var(--frame-right) - var(--frame-lip));
    width:var(--frame-lip);
    background:linear-gradient(90deg, #7a8086, #eef1f4);
    clip-path:polygon(0 var(--frame-lip), 100% 0, 100% 100%, 0 calc(100% - var(--frame-lip)));
  }
  .view-bore{
    top:var(--frame-top); right:var(--frame-right); bottom:var(--frame-bottom); left:var(--frame-left);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 0 0 1px rgba(28,27,24,0.5),
      inset 0 22px 36px rgba(28,27,24,0.2);
  }
  .mark{
    position:fixed; top:calc((var(--frame-top) - 14px) / 2); left:calc(var(--frame-left) * 0.42); z-index:2;
    font-family:'Cinzel', serif; font-size:12px; font-weight:500; letter-spacing:.32em;
    color:var(--ink-secondary); pointer-events:none;
  }
  .hud{
    position:fixed; inset:0; z-index:2; pointer-events:none;
  }
  .open, .back, .reset{
    pointer-events:auto; border:0; background:transparent; color:var(--ink);
    font-family:'Cinzel', serif; letter-spacing:.36em; cursor:pointer;
  }
  .open{
    position:fixed; left:50%; bottom:calc(var(--frame-bottom) + 4.5vh); transform:translateX(-50%);
    font-size:12px; opacity:0; pointer-events:none;
    transition:opacity .6s ease;
  }
  .open.ready{ opacity:1; color:var(--ink); pointer-events:auto; }
  .open span{
    display:block; width:1px; height:36px; margin:14px auto 0; background:var(--ink); opacity:.35;
    position:relative; overflow:hidden;
  }
  .open span::after{
    content:''; position:absolute; left:0; top:-100%; width:100%; height:100%;
    background:var(--ink); animation:drip 1.8s ease-in-out infinite;
  }
  @keyframes drip{ 0%{ top:-100%; } 70%{ top:100%; } 100%{ top:100%; } }
  .back, .reset{
    position:fixed; top:calc((var(--frame-top) - 28px) / 2); right:calc(var(--frame-right) * 0.4); font-size:11px; font-weight:500;
    padding:6px 12px; border-radius:999px;
    color:var(--ink-secondary); opacity:0;
    pointer-events:none; transition:opacity .45s ease, background .2s ease, color .2s ease;
  }
  .back:hover, .reset:hover{ background:rgba(28,27,24,0.07); color:var(--ink); }
  .reset{ right:calc(var(--frame-right) * 0.4 + 86px); }
  body.inside .back,
  body.inside.focusing .reset{ opacity:1; pointer-events:auto; }
  body.inside .open{ opacity:0; pointer-events:none; }
  .status{
    position:fixed; left:calc(var(--frame-left) + 16px); bottom:calc(var(--frame-bottom) + 14px);
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.22em; opacity:0;
    transition:opacity .6s ease; pointer-events:none;
    max-width:min(78vw, 460px); line-height:1.7; color:var(--mute);
  }
  .status.on{ opacity:1; }
  .status.is-error{ opacity:1; }
  .protocol-note{
    position:fixed; left:calc(var(--frame-left) + 16px); bottom:calc(var(--frame-bottom) + 86px);
    z-index:4; max-width:min(78vw, 420px);
    font-family:'Noto Serif TC', serif; font-size:13px; line-height:1.5; color:var(--ink);
  }
  .protocol-note[hidden]{ display:none; }
  .retry{
    position:fixed; left:calc(var(--frame-left) + 16px); bottom:calc(var(--frame-bottom) + 46px);
    z-index:4; min-height:36px; padding:6px 14px;
    border:1px solid rgba(28,27,24,0.28); border-radius:999px; background:var(--paper);
    color:var(--ink); font-family:'Noto Serif TC', serif; font-size:14px; line-height:1;
    pointer-events:auto; cursor:pointer;
  }
  .retry[hidden]{ display:none; }
  .retry:disabled{ opacity:0.55; cursor:default; }
  .status.is-tank{
    left:50%; right:auto; top:50%; bottom:auto; width:auto; max-width:none;
    transform:translate(-50%, -50%); text-align:center; letter-spacing:0;
  }
  .tank-load{
    position:relative; width:96px; height:96px; color:var(--ink);
  }
  .tank-load-spin{
    display:block; width:100%; height:100%;
    animation:skelio-spin 1.2s linear infinite;
  }
  .tank-load-track, .tank-load-arc{ fill:none; stroke-width:2.5; }
  .tank-load-track{ stroke:rgba(28,27,24,0.16); }
  .tank-load-arc{
    stroke:currentColor; stroke-linecap:round;
    transform-box:fill-box; transform-origin:center; transform:rotate(-90deg);
  }
  .tank-load-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel', serif; font-size:15px; font-weight:500; letter-spacing:.04em;
    font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .focus-name{ display:none; }
  .scroll-hud{
    position:fixed; left:50%; bottom:calc(var(--frame-bottom) + 16px); transform:translateX(-50%);
    z-index:3; display:flex; align-items:center; gap:14px;
    padding:9px 20px; border-radius:999px;
    background:var(--glass-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 30px rgba(28,27,24,0.08);
    opacity:0; pointer-events:none; transition:opacity .45s ease;
    font-family:'Cinzel', serif; font-size:11px; font-weight:500; letter-spacing:.18em; color:var(--ink);
  }
  body.inside .scroll-hud{ opacity:1; }
  .scroll-hud-bar{
    width:110px; height:3px; border-radius:999px; background:rgba(28,27,24,0.14);
    overflow:hidden; position:relative;
  }
  .scroll-hud-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--ink); border-radius:999px; transition:width 0.08s linear;
  }
  .specimen-card{
    position:fixed; left:0; top:0; z-index:4;
    width:min(316px, 86vw); padding:20px 22px 18px;
    border-radius:20px;
    background:var(--glass-bg);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 44px rgba(28,27,24,0.11), 0 2px 6px rgba(28,27,24,0.05);
    color:var(--ink);
    opacity:0; pointer-events:none;
    transform:translate3d(-9999px,-9999px,0) scale(0.96);
    transition:opacity .26s cubic-bezier(.22,1,.36,1), box-shadow .26s ease;
    cursor:pointer;
  }
  .specimen-card.visible{
    opacity:1; pointer-events:auto;
    transform:translate3d(var(--card-x, 24px), var(--card-y, 24px), 0) scale(1);
  }
  .specimen-card:hover{
    box-shadow:0 24px 52px rgba(28,27,24,0.16), 0 4px 12px rgba(28,27,24,0.08);
  }
  .specimen-card-top{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-family:'Cinzel', serif; font-size:11px; font-weight:500; letter-spacing:.16em; color:var(--accent);
  }
  .specimen-card-name{
    font-size:21px; font-weight:600; margin-top:6px; letter-spacing:.02em; line-height:1.25; color:var(--ink);
  }
  .specimen-card-latin{
    font-style:italic; font-size:13px; color:var(--ink-secondary); margin-top:3px; line-height:1.35;
  }
  .specimen-card-meta{
    font-size:12px; color:var(--mute); margin-top:10px; letter-spacing:.03em;
  }
  .specimen-card-summary{
    font-size:13px; line-height:1.6; color:var(--ink-secondary); margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .specimen-card-footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:12px;
    border-top:1px solid rgba(28,27,24,0.1);
  }
  .specimen-card-price{
    font-family:'Cinzel', serif; font-size:15px; font-weight:600; letter-spacing:.06em; color:var(--ink);
  }
  .specimen-card-actions{
    display:flex; align-items:center; gap:10px;
  }
  .card-share-btn{
    border:1px solid rgba(28,27,24,0.22); background:rgba(255,255,255,0.78);
    color:var(--ink); border-radius:999px; padding:6px 13px;
    font-size:12px; font-family:'Noto Serif TC', serif; cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .card-share-btn:hover{ background:#fff; border-color:var(--ink); }
  .card-plus-btn{
    width:36px; height:36px; border-radius:50%; border:0;
    background:var(--ink); color:#fff; font-size:18px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .2s ease, background .2s ease;
  }
  .card-plus-btn:hover{ transform:scale(1.08); background:#33312b; }
  @keyframes skelio-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .open span::after, .status.is-loading::before, .tank-load-spin{ animation:none; }
  }
  @media (max-width:768px), (max-height:520px) and (pointer:coarse){
    html, body{ max-width:100%; overflow-x:hidden; }
    canvas{
      top:0; right:0; bottom:auto; left:0;
      width:100%; max-width:100%;
      height:100vh; height:100dvh;
    }
    :root{
      --frame-top:calc(18px + env(safe-area-inset-top, 0px));
      --frame-right:calc(12px + env(safe-area-inset-right, 0px));
      --frame-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
      --frame-left:calc(12px + env(safe-area-inset-left, 0px));
      --frame-lip:6px;
    }
    .mark{
      top:calc(var(--frame-top) + 10px);
      left:calc(var(--frame-left) + 12px);
      font-size:clamp(11px, 3.2vw, 13px);
      letter-spacing:.22em;
    }
    .open{
      bottom:calc(var(--frame-bottom) + 14px);
      min-width:44px; min-height:44px;
      padding:12px 18px;
      font-size:clamp(12px, 3.4vw, 14px);
    }
    .back, .reset{
      top:calc(var(--frame-top) + 6px);
      left:auto;
      min-width:44px; min-height:44px;
      padding:0 14px;
      font-size:12px; letter-spacing:.14em;
      display:inline-flex; align-items:center; justify-content:center;
      white-space:nowrap;
    }
    .back{ right:calc(var(--frame-right) + 8px); }
    .reset{ right:calc(var(--frame-right) + 92px); }
    .status{
      left:calc(var(--frame-left) + 12px);
      right:calc(var(--frame-right) + 12px);
      bottom:calc(var(--frame-bottom) + 108px);
      max-width:none; text-align:center;
      font-size:clamp(11px, 3vw, 13px);
    }
    .protocol-note{
      left:12px; right:12px; bottom:auto; max-width:none; text-align:center;
      top:calc(var(--frame-top) + 8px);
    }
    .retry{
      left:50%; bottom:calc(var(--frame-bottom) + 156px);
      transform:translateX(-50%);
      min-height:44px; padding:0 18px;
    }
    body.inside .retry{
      top:calc(var(--frame-top) + 148px);
      bottom:auto;
    }
    body.inside .status{
      top:calc(var(--frame-top) + 96px);
      bottom:auto;
    }
    .status.is-loading::before{
      content:"";
      display:inline-block;
      width:14px; height:14px; margin-right:8px;
      border-radius:50%;
      border:2px solid rgba(28,27,24,.25);
      border-top-color:currentColor;
      vertical-align:-2px;
      animation:skelio-spin .8s linear infinite;
    }
    .status.is-tank.is-loading::before{ content:none; display:none; }
    .scroll-hud{
      left:calc(var(--frame-left) + 8px);
      right:calc(var(--frame-right) + 8px);
      top:calc(var(--frame-top) + 52px);
      bottom:auto; transform:none; width:auto;
      gap:8px; padding:8px 12px;
      font-size:10px; letter-spacing:.1em;
      pointer-events:none;
    }
    .scroll-hud-bar{ flex:1 1 auto; width:auto; min-width:36px; }
    #scrollStageLabel{
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:42vw;
    }
    .specimen-card{
      left:calc(var(--frame-left) + 8px);
      right:calc(var(--frame-right) + 8px);
      top:auto;
      bottom:calc(var(--frame-bottom) + 8px);
      width:auto;
      max-height:min(46dvh, 420px);
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:16px 16px 14px;
      transform:translate3d(0, 24px, 0);
    }
    .specimen-card.visible{ transform:none; }
    .specimen-card-name{ font-size:clamp(18px, 5vw, 22px); }
    .specimen-card-summary{ -webkit-line-clamp:4; }
    .specimen-card-footer{ flex-wrap:wrap; gap:8px; }
    .card-share-btn, .card-plus-btn{ min-width:44px; min-height:44px; }
    .card-plus-btn{ width:44px; height:44px; }
  }
</style>

<script>
const statusEl = document.getElementById('status');
function showTankProgress(pct){
  const shown = Math.max(0, Math.min(100, pct));
  statusEl.classList.add('on', 'is-tank');
  statusEl.classList.remove('is-loading');
  let load = statusEl.querySelector('.tank-load');
  if (!load) {
    statusEl.textContent = '';
    statusEl.insertAdjacentHTML('beforeend',
      '<div class="tank-load" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="生態箱載入進度">' +
      '<svg class="tank-load-spin" viewBox="0 0 80 80" aria-hidden="true">' +
      '<circle class="tank-load-track" cx="40" cy="40" r="30"></circle>' +
      '<circle class="tank-load-arc" cx="40" cy="40" r="30" pathLength="100"></circle>' +
      '</svg><span class="tank-load-pct"></span></div>');
    load = statusEl.querySelector('.tank-load');
  }
  load.setAttribute('aria-valuenow', String(shown));
  const arc = load.querySelector('.tank-load-arc');
  arc.setAttribute('stroke-dasharray', Math.max(12, shown) + ' 100');
  const label = load.querySelector('.tank-load-pct');
  const next = shown + '%';
  if (label.textContent !== next) label.textContent = next;
}
function showStatus(text){
  if (!statusEl) return;
  statusEl.classList.remove('is-error');
  if (typeof text === 'string' && text.indexOf('LOADING TANK') === 0) {
    const match = text.match(/(\d+)\s*%/);
    showTankProgress(match ? Number(match[1]) : 0);
    return;

function fetchModel(file, priority){
  const url = modelUrl(file);
  const attempt = tankGeneration;
  const init = {};
  if (priority) init.priority = priority;
  let lastPct = -1;
  const pending = (file === '生態箱.glb' && window.SKELIO_TANK_RESPONSE)
    ? window.SKELIO_TANK_RESPONSE
    : fetch(url, init);
  if (file === '生態箱.glb') window.SKELIO_TANK_RESPONSE = null;
  return pending.then((res) => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = Number(res.headers.get('content-length')) || 0;
    if (priority !== 'high' || !res.body || !total || !res.body.getReader) return res.arrayBuffer();
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    const read = () => reader.read().then(({ done, value }) => {
      if (done) {
        const buf = new Uint8Array(received);
        let offset = 0;
        for (let i = 0; i < chunks.length; i++) {
          buf.set(chunks[i], offset);
          offset += chunks[i].length;
        }
        return buf.buffer;
      }
      chunks.push(new Uint8Array(value));
      received += value.length;
      const pct = Math.min(99, Math.round(received / total * 100));
      if (pct !== lastPct && attempt === tankGeneration) {

      return read();
    });

  box.getCenter(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fitted = target / maxDim;
  obj.scale.setScalar(fitted);
  obj.position.copy(center).multiplyScalar(-fitted);
  obj.traverse(o => {
    if (!o.isMesh) return;

    o.castShadow = false;
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);

function seatGrounded(seat){
  if (!seat.mesh) return false;
  groundRay.near = 0.01;
  groundRay.far = 0.5;
  const reach = boxSize.y * 0.055;
  groundSide.crossVectors(seat.normal, seat.tangent).normalize();
  groundDir.copy(seat.normal).negate();
  const checks = [[0, 0], [reach, 0], [-reach, 0], [0, reach * 0.65], [0, -reach * 0.65]];
  let hits = 0;
  for (let i = 0; i < checks.length; i++){
    groundOrigin.copy(seat.point)
      .addScaledVector(seat.tangent, checks[i][0])
      .addScaledVector(groundSide, checks[i][1])
      .addScaledVector(seat.normal, 0.26);
    groundRay.set(groundOrigin, groundDir);
    const hit = groundRay.intersectObject(seat.mesh, false)[0];
    if (!hit || hit.distance > 0.4) continue;
    hits += 1;
  }
  return hits >= 4;
}

function scanTankMesh(mesh, into){
  if (!mesh.isMesh || !mesh.userData.isTankPart || !mesh.geometry) return;
  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  const dims = [size.x, size.y, size.z].sort((a, b) => a - b);
  if (dims[2] < boxSize.y * 0.14 || dims[1] < boxSize.y * 0.055) return;
  const axis = new THREE.Vector3(1, 0, 0);
  if (size.y >= size.x && size.y >= size.z) axis.set(0, 1, 0);
  else if (size.z >= size.x && size.z >= size.y) axis.set(0, 0, 1);
  const pos = mesh.geometry.attributes && mesh.geometry.attributes.position;
  if (!pos) return;
  const index = mesh.geometry.index;
  const triCount = index ? index.count / 3 : pos.count / 3;
  const step = Math.max(1, Math.floor(triCount / 180));
  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const e1 = new THREE.Vector3();
  const e2 = new THREE.Vector3();
  const n = new THREE.Vector3();
  const mid = new THREE.Vector3();
  const list = [];
  for (let t = 0; t < triCount; t += step){
    const i0 = index ? index.getX(t * 3) : t * 3;
    const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
    const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;
    vA.fromBufferAttribute(pos, i0).applyMatrix4(mesh.matrixWorld);
    vB.fromBufferAttribute(pos, i1).applyMatrix4(mesh.matrixWorld);
    vC.fromBufferAttribute(pos, i2).applyMatrix4(mesh.matrixWorld);
    e1.subVectors(vB, vA);
    e2.subVectors(vC, vA);
    n.crossVectors(e1, e2);
    const area = n.length() * 0.5;
    if (area < 2e-5) continue;
    n.multiplyScalar(1 / (area * 2));
    const span = Math.max(e1.length(), e2.length(), vB.distanceTo(vC));
    const altitude = span > 1e-6 ? (area * 2) / span : 0;
    if (altitude < span * 0.12) continue;
    mid.copy(vA).add(vB).add(vC).multiplyScalar(1 / 3);
    const outward = e1.copy(mid).sub(center);
    if (outward.lengthSq() > 1e-4 && n.dot(outward) < -0.15 * outward.length()) n.negate();
    if (n.y < -0.2) continue;
    const facing = Math.max(0, n.z) + Math.abs(n.x) * 0.4;
    if (facing < 0.08 && n.y < 0.3) continue;
    if (mid.y < boxSize.y * 0.18 || mid.y > boxSize.y * 0.92) continue;
    if (Math.abs(mid.x) > boxSize.x * 0.42 || Math.abs(mid.z) > boxSize.z * 0.38) continue;
    let tangent = axis.clone().addScaledVector(n, -axis.dot(n));
    if (tangent.lengthSq() < 1e-6) tangent = new THREE.Vector3(0, 1, 0).addScaledVector(n, -n.y);
    if (tangent.lengthSq() < 1e-6) continue;
    tangent.normalize();
    if (tangent.y < 0) tangent.negate();
    const climb = 1 - Math.abs(n.y);
    const rest = Math.max(0, n.y);
    const score = Math.sqrt(area) * (0.4 + climb * 0.75 + rest * 0.35) + facing * 0.3;
    list.push({
      point: mid.clone(),
      normal: n.clone(),
      tangent: tangent.clone(),
      score: score,
      mesh: mesh
    });
  }
  list.sort((a, b) => b.score - a.score);
  into.push(...list.slice(0, 8));
}

function makeTangent(normal){
  const axis = Math.abs(normal.y) < 0.85
    ? new THREE.Vector3(0, 1, 0)
    : new THREE.Vector3(1, 0, 0);
  const tangent = axis.clone().addScaledVector(normal, -axis.dot(normal));
  if (tangent.lengthSq() < 1e-6) return new THREE.Vector3(1, 0, 0);
  tangent.normalize();
  if (tangent.y < 0) tangent.negate();
  return tangent;
}

function raySeatNear(aim, wantClimb){
  if (!tankMeshes.length) return null;
  const ray = new THREE.Raycaster();
  ray.far = Math.max(boxSize.x, boxSize.y, boxSize.z) * 1.5;
  const candidates = [];
  const addHits = (origin, dir, loose) => {
    if (dir.lengthSq() < 1e-8) return;
    ray.set(origin, dir.clone().normalize());
    const hits = ray.intersectObjects(tankMeshes, false);
    for (let i = 0; i < Math.min(hits.length, 5); i++){
      const hit = hits[i];
      if (hit.object.userData.isFrame || hit.object.userData.isGlass) continue;
      if (hit.point.z > boxSize.z * 0.2) continue;
      if (hit.point.y < boxSize.y * 0.16 || hit.point.y > boxSize.y * 0.9) continue;
      if (Math.abs(hit.point.x) > boxSize.x * 0.45) continue;
      const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
      const toRay = new THREE.Vector3().subVectors(origin, hit.point);
      if (normal.dot(toRay) < 0) normal.negate();
      if (normal.y < -0.25) continue;
      if (!loose && wantClimb && normal.y > 0.75) continue;
      if (!loose && !wantClimb && normal.y < 0.15) continue;
      const dist = hit.point.distanceTo(aim);
      let score = 4.2 - dist / (boxSize.y * 0.36);
      score += Math.max(0, 0.16 - Math.abs(hit.point.z)) * 2.4;
      score += Math.max(0, normal.z) * 0.3;
      if (wantClimb) score += (1 - Math.abs(normal.y - 0.25)) * 1.2;
      else score += Math.max(0, normal.y) * 1.25;
      candidates.push({
        point: hit.point.clone(),
        normal: normal,
        tangent: makeTangent(normal),
        score: score,
        mesh: hit.object
      });
    }
  };

  const side = Math.abs(aim.x) < 0.04 ? 1 : Math.sign(aim.x);
  // Cast from the open center of the tank toward each zone.
  const origins = [
    new THREE.Vector3(0, aim.y, boxSize.z * 0.06),
    new THREE.Vector3(aim.x * 0.2, aim.y + boxSize.y * 0.05, boxSize.z * 0.04),
    new THREE.Vector3(aim.x * 0.2, aim.y - boxSize.y * 0.05, boxSize.z * 0.04),
    new THREE.Vector3(-side * boxSize.x * 0.08, aim.y, 0),
    new THREE.Vector3(aim.x, aim.y + boxSize.y * 0.34, 0),
    new THREE.Vector3(aim.x, aim.y + boxSize.y * 0.22, boxSize.z * 0.02),
    new THREE.Vector3(aim.x + side * boxSize.x * 0.08, aim.y + boxSize.y * 0.18, -boxSize.z * 0.02)
  ];
  origins.forEach(origin => {
    addHits(origin, new THREE.Vector3(aim.x - origin.x, aim.y - origin.y, aim.z - origin.z - boxSize.z * 0.04), false);
  });
  if (!candidates.length){
    origins.forEach(origin => {
      addHits(origin, new THREE.Vector3(aim.x - origin.x, aim.y - origin.y, aim.z - origin.z), true);
    });
  }

  candidates.sort((a, b) => b.score - a.score);
  return candidates[0] || null;
}

    const aims = [
      aim,
      aim.clone().add(new THREE.Vector3(boxSize.x * 0.04, boxSize.y * 0.03, -boxSize.z * 0.02)),
      aim.clone().add(new THREE.Vector3(-boxSize.x * 0.04, -boxSize.y * 0.03, -boxSize.z * 0.02))
    ];
    let seat = null;
    for (let a = 0; a < aims.length && !seat; a++){
      seat = raySeatNear(aims[a], wantClimb);
      if (seat && chosen.some(c => c.point.distanceTo(seat.point) < gap)) seat = null;
    }
    for (let a = 0; a < aims.length && !seat; a++){
      seat = raySeatNear(aims[a], !wantClimb);
      if (seat && chosen.some(c => c.point.distanceTo(seat.point) < gap * 0.75)) seat = null;
    }
    if (!seat){
      let best = null;
      let bestScore = -1e9;
      seatCatalog.forEach(s => {
        if (s.point.z > boxSize.z * 0.18) return;
        if (chosen.some(c => c.point.distanceTo(s.point) < gap * 0.7)) return;
        const dist = s.point.distanceTo(aim);
        const score = s.score - dist * 0.9 - Math.abs(s.point.z) * 1.2;
        if (score > bestScore){
          bestScore = score;
          best = s;
        }
      });
      seat = best;
    }
    if (seat) chosen.push(seat);
  });
  return chosen.slice(0, need);
}

const sitX = new THREE.Vector3();
const sitZ = new THREE.Vector3();
const sitM = new THREE.Matrix4();
const sitRay = new THREE.Raycaster();
const sitOrigin = new THREE.Vector3();
const sitDir = new THREE.Vector3();
const sitNormal = new THREE.Vector3();
function orientOn(group, normal, tangent){
  sitNormal.copy(normal).normalize();
  let tan = tangent.clone().addScaledVector(sitNormal, -tangent.dot(sitNormal));
  if (tan.lengthSq() < 1e-6) tan.set(0, 1, 0).addScaledVector(sitNormal, -sitNormal.y);
  tan.normalize();
  if (tan.y < -0.05) tan.negate();
  if (group.userData.longAxis === 'z'){
    sitX.crossVectors(sitNormal, tan).normalize();
    sitZ.crossVectors(sitX, sitNormal).normalize();
  } else {
    sitX.copy(tan);
    sitZ.crossVectors(sitNormal, sitX).normalize();
    sitX.crossVectors(sitZ, sitNormal).normalize();
  }
  sitM.makeBasis(sitX, sitNormal, sitZ);
  group.quaternion.setFromRotationMatrix(sitM);
}
function sitOn(group, seat){
  const spec = group.userData && group.userData.spec;
  const pref = spec && seatPrefs[spec.model];
  const anchor = (pref && pref.anchor)
    ? new THREE.Vector3(pref.anchor[0], pref.anchor[1], pref.anchor[2])
    : seat.point.clone();
  sitNormal.copy(
    (pref && pref.normal)
      ? new THREE.Vector3(pref.normal[0], pref.normal[1], pref.normal[2])
      : seat.normal
  ).normalize();
  const tangent = makeTangent(sitNormal);
  orientOn(group, sitNormal, tangent);

  // Start with the pre-converged normal offset (belly * pref.lift)
  const baseBelly = group.userData.rawBelly || group.userData.belly;
  let normalOffset = baseBelly * (pref && pref.lift ? pref.lift : 1.0);
  group.position.copy(anchor).addScaledVector(sitNormal, normalOffset);
  group.updateMatrixWorld(true);

  // Iterative Re-scan Loop (up to 4 passes): verify ventral plane contact (|gap| <= 0.002) and strict glass cube bounds
  const meshes = tankMeshes.length ? tankMeshes : (seat.mesh ? [seat.mesh] : []);
  const vWorld = new THREE.Vector3();
  const rel = new THREE.Vector3();
  for (let iter = 0; iter < 4; iter++){
    // 1. Measure ventral contact plane distance along sitNormal
    let minProj = Infinity;
    group.traverse(o => {
      if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      const posAttr = o.geometry.attributes.position;
      const step = Math.max(1, Math.floor(posAttr.count / 250));
      for (let k = 0; k < posAttr.count; k += step){
        vWorld.fromBufferAttribute(posAttr, k).applyMatrix4(o.matrixWorld);
        rel.subVectors(vWorld, anchor);
        const proj = rel.dot(sitNormal);
        if (proj < minProj) minProj = proj;
      }
    });
    // Raycast at anchor along -sitNormal to confirm exact surface contact point
    sitOrigin.copy(anchor).addScaledVector(sitNormal, 0.18);
    sitDir.copy(sitNormal).negate();
    sitRay.near = 0.001;
    sitRay.far = 0.36;
    sitRay.set(sitOrigin, sitDir);
    const hit = meshes.length ? sitRay.intersectObjects(meshes, false)[0] : null;
    const surfProj = hit ? rel.subVectors(hit.point, anchor).dot(sitNormal) : 0;
    const gap = isFinite(minProj) ? (minProj - surfProj) : 0;

    if (Math.abs(gap) > 0.001){
      normalOffset -= gap;
      group.position.copy(anchor).addScaledVector(sitNormal, normalOffset);
      group.updateMatrixWorld(true);
    }

    // 2. Enforce strict interior glass cube volume bounds: X in [-1.88, 1.88], Y in [0.94, 3.12], Z in [-0.80, 0.68]
    const wbox = new THREE.Box3().setFromObject(group);
    let shiftX = 0, shiftY = 0, shiftZ = 0;
    if (wbox.min.x < -1.88) shiftX = -1.88 - wbox.min.x;
    else if (wbox.max.x > 1.88) shiftX = 1.88 - wbox.max.x;
    if (wbox.min.y < 0.94) shiftY = 0.94 - wbox.min.y;
    else if (wbox.max.y > 3.12) shiftY = 3.12 - wbox.max.y;
    if (wbox.min.z < -0.80) shiftZ = -0.80 - wbox.min.z;
    else if (wbox.max.z > 0.68) shiftZ = 0.68 - wbox.max.z;
    if (shiftX !== 0 || shiftY !== 0 || shiftZ !== 0){
      anchor.x += shiftX;
      anchor.y += shiftY;
      anchor.z += shiftZ;
      group.position.copy(anchor).addScaledVector(sitNormal, normalOffset);
      group.updateMatrixWorld(true);
    } else if (Math.abs(gap) <= 0.001){
      break;
    }
  }
}

const canLoadExternalTex = (typeof location !== 'undefined' && location.protocol !== 'file:');
const texWait = [];
let texActive = 0;
let texGate = false;
function pumpTex(){
  const slots = mobileNow() ? 3 : 6;
  while (texGate && texActive < slots && texWait.length) {
    texActive += 1;
    const job = texWait.shift();
    job(() => {
      texActive -= 1;
      pumpTex();
    });
  }
}
function releaseTextures(){
  texGate = true;
  pumpTex();
}
function loadTiledTex(url, repeatX, repeatY, isColor, onDone){
  if (!canLoadExternalTex) return null;
  texWait.push((done) => {
    const img = new Image();
    img.decoding = 'async';
    if ('fetchPriority' in img) img.fetchPriority = mobileNow() ? 'low' : 'auto';
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX || 2, repeatY || 2);
      if (isColor) tex.encoding = THREE.sRGBEncoding;
      tex.needsUpdate = true;
      if (onDone) onDone(tex);
      done();
    };
    img.onerror = () => done();
    img.src = url;
  });
  pumpTex();
  return null;
}

function makePBRSet(name, diffUrl, norUrl, roughUrl, rx, ry, roughVal, metalVal){
  const mat = new THREE.MeshStandardMaterial({
    name: name,
    roughness: roughVal,
    metalness: metalVal,
    side: THREE.DoubleSide
  });
  mat.userData = { loaded4K: false, pendingMeshes: [] };
  if (canLoadExternalTex){
    loadTiledTex(diffUrl, rx, ry, true, (tex) => {
      mat.map = tex;
      mat.needsUpdate = true;
      mat.userData.loaded4K = true;
      const list = mat.userData.pendingMeshes.splice(0);
      for (let i = 0; i < list.length; i++){
        const m = list[i];
        ensureTriplanarBoxUVs(m.geometry, m.matrixWorld, 0.72);
        m.material = mat;
      }
    });
    loadTiledTex(norUrl, rx, ry, false, (tex) => {
      mat.normalMap = tex;
      mat.needsUpdate = true;
    });
    loadTiledTex(roughUrl, rx, ry, false, (tex) => {
      mat.roughnessMap = tex;
      mat.needsUpdate = true;
    });
  }
  return mat;
}

// Silver metal (ambientCG Metal049A, CC0) for tank base / lid / frame.
function makeMetalEnvMap(){
  // Minimal studio-like environment so metal reads as silver (applied to metal only).
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(10, 32, 16);
  const cols = [];
  const pos = envGeo.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const t = THREE.MathUtils.clamp((pos.getY(i) / 10) * 0.5 + 0.5, 0, 1);
    const c = new THREE.Color(0x3a3f44).lerp(new THREE.Color(0xf4f6f8), Math.pow(t, 0.8));
    cols.push(c.r, c.g, c.b);
  }
  envGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  envGeo.dispose();
  return rt.texture;
}

function makeMetalSet(name, id, rx, ry){
  const base = 'textures/' + id + '/' + id + '_4K-JPG_';

  const mat = makePBRSet(name, base + 'Color.jpg', base + 'NormalGL.jpg', base + 'Roughness.jpg', rx, ry, 0.16, 1.0);
  mat.color.set(0xd9dde2);
  mat.envMap = makeMetalEnvMap();

    mat.metalnessMap = tex;
    mat.needsUpdate = true;
  });
  return mat;
}

function ensureTriplanarBoxUVs(geometry, worldMatrix, scale){
  if (!geometry || !geometry.attributes || !geometry.attributes.position) return;
  if (!geometry.attributes.normal) geometry.computeVertexNormals();
  const pos = geometry.attributes.position;
  const nor = geometry.attributes.normal;
  const uvs = new Float32Array(pos.count * 2);
  const v = new THREE.Vector3();
  const n = new THREE.Vector3();
  const s = scale || 0.85;
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    if (worldMatrix) v.applyMatrix4(worldMatrix);
    n.fromBufferAttribute(nor, i);
    if (worldMatrix) n.transformDirection(worldMatrix);
    const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
    if (ay >= ax && ay >= az){
      uvs[i * 2] = v.x * s;
      uvs[i * 2 + 1] = v.z * s;
    } else if (ax >= ay && ax >= az){
      uvs[i * 2] = v.z * s;
      uvs[i * 2 + 1] = v.y * s;
    } else {
      uvs[i * 2] = v.x * s;
      uvs[i * 2 + 1] = v.y * s;
    }
  }
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
}

function assignTerrariumPBRMaterial(mesh, part){
  if (!mesh || !mesh.geometry) return;
  const box = new THREE.Box3().setFromObject(mesh);
  const c = new THREE.Vector3();
  box.getCenter(c);
  const ny = c.y / Math.max(boxSize.y, 1e-6);
  const nor = mesh.geometry.attributes.normal;
  let avgNy = 0;
  if (nor && nor.count > 0){
    const step = Math.max(1, Math.floor(nor.count / 120));
    let sum = 0, cnt = 0;
    const n = new THREE.Vector3();
    for (let i = 0; i < nor.count; i += step){
      n.fromBufferAttribute(nor, i).transformDirection(mesh.matrixWorld);
      sum += n.y;
      cnt += 1;
    }
    avgNy = cnt ? sum / cnt : 0;
  }
  const idx = parseInt((mesh.name || '').replace(/\D+/g, ''), 10) || 0;
  let targetMat = null;
  if (part === 'base'){
    targetMat = pbrSets.metal;
  } else if (part === 'lid'){
    targetMat = pbrSets.metal;
  } else if (part === 'frame'){
    targetMat = pbrSets.metal;
  } else if (part === 'ground' || (ny < 0.365 && part !== 'trunk' && part !== 'trunk_left' && part !== 'trunk_right')){
    if (avgNy > 0.38){
      targetMat = (idx % 2 === 0) ? pbrSets.leaves : pbrSets.leafCard;
    } else {
      targetMat = (idx % 2 === 0) ? pbrSets.soil : pbrSets.soilAlt;
    }
  } else if (ny < 0.46){
    if (avgNy > 0.45){
      targetMat = (idx % 2 === 0) ? pbrSets.moss : pbrSets.mossAlt;
    } else if (part === 'trunk' || part === 'trunk_left' || part === 'trunk_right'){
      targetMat = (idx % 2 === 0) ? pbrSets.bark : pbrSets.barkAlt;
    } else {
      targetMat = (idx % 2 === 0) ? pbrSets.rock : pbrSets.rockAlt;
    }
  } else {
    if (avgNy > 0.42 || part === 'vine'){
      targetMat = (idx % 2 === 0) ? pbrSets.mossAlt : pbrSets.moss;
    } else {
      targetMat = (idx % 2 === 0) ? pbrSets.bark : pbrSets.barkAlt;
    }
  }
  const hasBakedMap = Boolean(mesh.material && mesh.material.map);
  if (!hasBakedMap || (targetMat && targetMat.userData && targetMat.userData.loaded4K)){
    ensureTriplanarBoxUVs(mesh.geometry, mesh.matrixWorld, 0.72);
    mesh.material = targetMat;
  } else if (targetMat && targetMat.userData && canLoadExternalTex){
    if (! mesh.geometry.attributes.uv){
      ensureTriplanarBoxUVs(mesh.geometry, mesh.matrixWorld, 0.72);
    }
    targetMat.userData.pendingMeshes.push(mesh);
  }
}

function panelLike(mesh){
  const geo = mesh.geometry;
  if (!geo) return false;
  if (!geo.boundingBox) geo.computeBoundingBox();
  if (!geo.boundingBox) return false;
  const s = new THREE.Vector3();
  geo.boundingBox.getSize(s);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  return (dims[0] < dims[2] * 0.045 && dims[2] > 0.08) || (dims[0] < 0.012 && dims[1] > 0.15 && dims[2] > 0.15);
}

function exteriorShellPart(mesh){
  const box = new THREE.Box3().setFromObject(mesh);
  const c = new THREE.Vector3();
  const s = new THREE.Vector3();
  box.getCenter(c);
  box.getSize(s);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  const minX = -boxSize.x * 0.5;
  const maxX = boxSize.x * 0.5;
  const minY = 0;
  const maxY = boxSize.y;
  const minZ = -boxSize.z * 0.5;
  const maxZ = boxSize.z * 0.5;
  const ny = (c.y - minY) / Math.max(boxSize.y, 1e-6);
  if (box.min.y <= minY + boxSize.y * 0.04 && s.x > boxSize.x * 0.62 && s.z > boxSize.z * 0.62 && s.y < boxSize.y * 0.45) return 'base';
  const onTop = box.max.y >= maxY - boxSize.y * 0.06;
  const wideCap = s.x > boxSize.x * 0.65 && s.z > boxSize.z * 0.7;
  const flat = s.y < boxSize.y * 0.14;
  if ((onTop || ny > 0.88) && wideCap && flat) return 'lid';
  const slender = dims[0] < boxSize.y * 0.05 && (dims[0] / Math.max(dims[2], 1e-6)) < 0.12 && dims[2] > boxSize.x * 0.3;
  const margin = 0.03;
  const onShell = box.min.x <= minX + boxSize.x * margin || box.max.x >= maxX - boxSize.x * margin ||
    box.min.y <= minY + boxSize.y * margin || box.max.y >= maxY - boxSize.y * margin ||
    box.min.z <= minZ + boxSize.z * margin || box.max.z >= maxZ - boxSize.z * margin;
  if (slender && onShell) return 'frame';
  return null;
}

function classifyTankPart(mesh){
  const box = new THREE.Box3().setFromObject(mesh);
  const c = new THREE.Vector3();
  const s = new THREE.Vector3();
  box.getCenter(c);
  box.getSize(s);
  const dims = [s.x, s.y, s.z].sort((a, b) => a - b);
  const ny = c.y / Math.max(boxSize.y, 1e-6);
  const nx = c.x / Math.max(boxSize.x * 0.5, 1e-6);
  const thinRatio = dims[0] / Math.max(dims[2], 1e-6);
  if (panelLike(mesh) || thinRatio < 0.045) return 'glass';
  const shell = exteriorShellPart(mesh);
  if (shell) return shell;
  if (s.y > boxSize.y * 0.32 && Math.max(s.x, s.z) > boxSize.x * 0.12){
    if (nx < -0.18) return 'trunk_left';
    if (nx > 0.18) return 'trunk_right';
    return 'trunk';
  }
  if (ny < 0.28 && Math.max(s.x, s.z) > boxSize.x * 0.1) return 'ground';
  if (dims[0] < boxSize.y * 0.035 && dims[2] > boxSize.y * 0.08) return 'vine';
  if (s.y < boxSize.y * 0.22 && Math.max(s.x, s.z) > boxSize.x * 0.12) return 'branch';
  return 'detail';
}

function beginTank(){
  if (tankInflight) return tankInflight;
  const generation = ++tankGeneration;
  hideRetry();
  showStatus('LOADING TANK');
  const bytes = fetchModel('生態箱.glb', 'high');
  Promise.all([bytes.catch(() => {}), beetleReady]).then(releaseTextures, releaseTextures);
  const job = bytes.then(parseModel).catch((err) => {
    if (generation !== tankGeneration) throw err;
    console.error('生態箱改由一般方式載入', err);
    forgetModel('生態箱.glb');
    return loadGLB('生態箱.glb');
  }).then((gltf) => {
    if (generation !== tankGeneration || !gltf || boxMesh) return;
    const obj = gltf.scene;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    if (panelLike(o)){
      o.material = glassMat;
      o.renderOrder = 2;
      o.userData.isTankPart = false;
      o.userData.isGlass = true;
      o.userData.part = 'glass';
    } else if (o.material){
      o.material.side = THREE.DoubleSide;
      o.userData.isTankPart = true;
    }
  });
  const bounds = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  bounds.getSize(size);
  bounds.getCenter(center);
  if (!(size.y > 0)) throw new Error('生態箱尺寸無效');
  obj.position.sub(center);
  const wrap = new THREE.Group();
  wrap.add(obj);
  const height = 3.6;
  const s = height / (size.y || 1);
  wrap.scale.setScalar(s);
  wrap.position.y = height / 2;
  scene.add(wrap);
  boxMesh = wrap;
  boxSize.set(size.x * s, height, size.z * s);
  tankMeshes = [];
  const partCounts = {};
  const silverMeshes = [];
  wrap.updateMatrixWorld(true);
  wrap.traverse(o => {
    if (!o.isMesh) return;
    if (o.userData.isGlass){
      ensureTriplanarBoxUVs(o.geometry, o.matrixWorld, 0.72);
      o.material = glassMat;
      o.renderOrder = 2;
      o.userData.isTankPart = false;
      partCounts.glass = (partCounts.glass || 0) + 1;
      return;
    }
    const part = classifyTankPart(o);
    o.userData.part = part;
    if (part === 'glass'){
      ensureTriplanarBoxUVs(o.geometry, o.matrixWorld, 0.72);

  console.log('生態箱部位', partCounts);

  const front = boxSize.z * 0.5;

function insectsOpen(){

function detachInsectGroup(group){
  if (!group) return;
  if (group.parent) group.parent.remove(group);

}
function syncPlacedInsects(){
  const show = insectsOpen();

function specimenFailText(loaded, total){
  if (location.protocol === 'file:') return loadFailText();

  return '載入失敗';
}
function placeBeetles(options){
  if (placeInflight) return placeInflight;
  const keepExisting = !!(options && options.keepExisting);
  if (!beetles.length){
    showStatus('沒有可放置的模型');
    return Promise.resolve();
  }
  if (!tankReady || !seats.length){
    showStatus('生態箱尚未偵測完成');
    return Promise.resolve();
  }
  const placedModels = new Set(insectGroups.map((group) => group.userData.spec && group.userData.spec.model).filter(Boolean));
  const pending = beetles.map((spec, i) => ({ spec: spec, i: i })).filter(({ spec }) => !keepExisting || !placedModels.has(spec.model));
  if (!pending.length){
    loadErrorMode = '';
    hideRetry();
    if (insectsOpen()) showStatus('ORBIT · ZOOM');
    return Promise.resolve();
  }
  const generation = ++placeGeneration;
  const target = boxSize.y * 0.095;
  hideRetry();
  showStatus('LOADING  ' + (beetles.length - pending.length) + ' / ' + beetles.length);
  let loaded = beetles.length - pending.length;
  if (!keepExisting){
    insectGroups.forEach(detachInsectGroup);
    insectGroups = [];
    placedModels.clear();
    loaded = 0;
  }
  const assigned = beetles.map((_, i) => seats[i] || seats[seats.length - 1] || null);
  const loadOne = (spec, i) => loadGLB(spec.model).then((gltf) => {
    if (generation !== placeGeneration) return;
    if (!gltf || !gltf.scene) throw new Error('模型是空的');
    if (placedModels.has(spec.model) || gltf.scene.parent) return;
    const g = fitCreature(gltf.scene, target);
    if (generation !== placeGeneration){
      detachInsectGroup(g);
      return;
    }
    g.userData.isInsect = true;
    g.userData.spec = spec;
    g.userData.placeGeneration = generation;
    g.userData.rawBelly = g.userData.belly;
    const seat = assigned[i];
    if (seat) sitOn(g, seat);
    if (generation !== placeGeneration){
      detachInsectGroup(g);
      return;
    }
    g.visible = insectsOpen();
    if (g.visible) scene.add(g);
    insectGroups.push(g);
    placedModels.add(spec.model);
    loaded += 1;
    showStatus('LOADING  ' + loaded + ' / ' + beetles.length);
  }).catch((err) => {
    console.error('甲蟲模型載入失敗', spec.model, err);
    throw err;
  });
  const finish = (results) => {
    if (generation !== placeGeneration) return;
    syncPlacedInsects();
    const failed = results.filter(result => result.status === 'rejected').length;
    const totalPlaced = insectGroups.length;
    if (!totalPlaced){
      loadErrorMode = 'beetles';
      showLoadError(loadFailText());
      applyTankRoute();
      return;
    }
    if (failed || totalPlaced < beetles.length){
      loadErrorMode = 'beetles';
      showLoadError(specimenFailText(totalPlaced, beetles.length));
      applyTankRoute();
      return;
    }
    loadErrorMode = '';
    hideRetry();
    if (!insectsOpen()){
      if (statusEl && statusEl.textContent.indexOf('LOADING') === 0){
        statusEl.textContent = 'READY  ' + seats.length + ' SEATS';
        statusEl.classList.remove('on', 'is-loading', 'is-error');
      }
      applyTankRoute();
      return;
    }
    showStatus('ORBIT · ZOOM');
    applyTankRoute();
    setTimeout(() => {
      if (statusEl && generation === placeGeneration && statusEl.textContent.indexOf('ORBIT') === 0){
        statusEl.classList.remove('on', 'is-loading');
      }
    }, 1600);
  };
  const job = Promise.allSettled(pending.map(({ spec, i }) => loadOne(spec, i))).then(finish);
  placeInflight = job;
  const clearLock = () => {
    if (placeInflight === job) placeInflight = null;
  };
  job.then(clearLock, clearLock);
  return job;
}
function retryFailedLoads(){
  if (retryBtn && retryBtn.disabled) return;
  if (loadErrorMode === 'tank' || (!tankReady && loadErrorMode !== 'beetles')){
    if (tankInflight){

      return;

  const missing = beetles.filter((spec) => !insectGroups.some((group) => group.userData.spec && group.userData.spec.model === spec.model));

// --- Scroll-Driven Camera Choreography (GSAP ScrollTrigger + Lenis) + Manual Orbit Coexistence ---
const cameraPath = Array.isArray(SKELIO.cameraPath) && SKELIO.cameraPath.length ? SKELIO.cameraPath : [
  { p: 0.00, yaw: 0.00, pitch: 0.34, radiusRatio: 1.00, heightOffset:  0.10, label: 'CANOPY OVERVIEW' },
  { p: 0.25, yaw: 1.57, pitch: 0.22, radiusRatio: 0.78, heightOffset:  0.04, label: 'UPPER TRUNK' },
  { p: 0.50, yaw: 3.14, pitch: 0.12, radiusRatio: 0.64, heightOffset: -0.02, label: 'HEART OF TERRARIUM' },
  { p: 0.75, yaw: 4.71, pitch: 0.18, radiusRatio: 0.74, heightOffset: -0.08, label: 'MOSS FLOOR' },
  { p: 1.00, yaw: 6.283, pitch: 0.28, radiusRatio: 0.95, heightOffset:  0.00, label: 'FULL ORBIT' }
];

let baseHomeYaw = 0;
let baseHomePitch = 0.22;
let scrollProgress = 0;
let userYawOffset = 0;
let userPitchOffset = 0;
let userRadiusOffset = 0;
let lenis = null;
let scrollTriggerInstance = null;

function sampleCameraPath(p){
  const clamped = Math.max(0, Math.min(1, p));
  for (let i = 0; i < cameraPath.length - 1; i++){
    const a = cameraPath[i];
    const b = cameraPath[i + 1];
    if (clamped >= a.p && clamped <= b.p){
      const span = (b.p - a.p) || 1;
      const t = (clamped - a.p) / span;
      const s = t * t * (3 - 2 * t);
      return {
        yaw: a.yaw + (b.yaw - a.yaw) * s,
        pitch: a.pitch + (b.pitch - a.pitch) * s,
        radiusRatio: a.radiusRatio + (b.radiusRatio - a.radiusRatio) * s,
        heightOffset: a.heightOffset + (b.heightOffset - a.heightOffset) * s,
        label: t < 0.5 ? a.label : b.label
      };
    }
  }
  return cameraPath[cameraPath.length - 1];
}

const scrollHudFill = document.getElementById('scrollHudFill');
const scrollPctLabel = document.getElementById('scrollPctLabel');
const scrollStageLabel = document.getElementById('scrollStageLabel');

function applyScrollChoreography(p){
  scrollProgress = Math.max(0, Math.min(1, p));
  const sample = sampleCameraPath(scrollProgress);
  if (scrollHudFill) scrollHudFill.style.width = Math.round(scrollProgress * 100) + '%';
  if (scrollPctLabel) scrollPctLabel.textContent = Math.round(scrollProgress * 100) + '%';
  if (scrollStageLabel && sample.label) scrollStageLabel.textContent = sample.label;

  if (phase !== 'inside' || focusedInsect) return;
  targetOrbitYaw = baseHomeYaw + sample.yaw + userYawOffset;
  targetOrbitPitch = Math.max(-0.12, Math.min(1.28, sample.pitch + userPitchOffset));
  const pathRadius = homeRadius * sample.radiusRatio + userRadiusOffset;
  targetRadius = Math.max(radiusMin, Math.min(radiusMax, pathRadius));
  focus.set(
    homeFocus.x,
    homeFocus.y + sample.heightOffset * boxSize.y,
    homeFocus.z
  );
}

function initScrollChoreography(){
  if (window.Lenis && !lenis){
    lenis = new Lenis({
      lerp: reduce ? 1 : 0.085,
      smoothWheel: true,
      wheelMultiplier: 0.9
    });
    if (window.ScrollTrigger){
      lenis.on('scroll', ScrollTrigger.update);
    } else {
      lenis.on('scroll', (e) => {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
        applyScrollChoreography((e && typeof e.scroll === 'number' ? e.scroll : window.scrollY) / maxScroll);
      });
    }
  }
  if (window.gsap && window.ScrollTrigger && !scrollTriggerInstance){
    gsap.registerPlugin(ScrollTrigger);
    scrollTriggerInstance = ScrollTrigger.create({
      trigger: '#scrollTrack',
      start: 'top top',
      end: 'bottom bottom',
      scrub: true,
      onUpdate: (self) => {
        applyScrollChoreography(self.progress);
      }
    });
  }
}
initScrollChoreography();

function updateFloatingCard(){
  if (!cardEl || phase !== 'inside' || !insectGroups.length){
    if (cardEl) cardEl.classList.remove('visible');
    return;
  }
  let candidate = focusedInsect;
  if (!candidate){
    let bestScore = Infinity;
    const proximityLimit = boxSize.y * 0.92;
    for (let i = 0; i < insectGroups.length; i++){
      const g = insectGroups[i];
      if (!g.visible) continue;
      groupBox.setFromObject(g);
      groupBox.getCenter(groupCenter);
      const dist = camera.position.distanceTo(groupCenter);
      projVec.copy(groupCenter).project(camera);
      if (projVec.z < -1 || projVec.z > 1) continue;
      const screenDist = Math.hypot(projVec.x, projVec.y);
      if ((dist < proximityLimit || radius < homeRadius * 0.84) && screenDist < 0.42){
        const score = screenDist * 2.0 + (dist / proximityLimit);
        if (score < bestScore){
          bestScore = score;
          candidate = g;
        }
      }
    }
  }
  if (!candidate || !candidate.userData || !candidate.userData.spec){
    cardEl.classList.remove('visible');
    activeCardSpec = null;
    return;
  }
  populateCard(candidate.userData.spec);
  groupBox.setFromObject(candidate);
  groupBox.getCenter(groupCenter);
  projVec.copy(groupCenter).project(camera);
  const rawX = (projVec.x * 0.5 + 0.5) * innerWidth + 28;
  const rawY = (-projVec.y * 0.5 + 0.5) * innerHeight - 80;
  const cardW = Math.min(300, innerWidth * 0.84);
  const cardH = 210;
  const clampedX = Math.max(16, Math.min(innerWidth - cardW - 16, rawX));
  const clampedY = Math.max(64, Math.min(innerHeight - cardH - 64, rawY));

}

function pickInsect(clientX, clientY){
  pickNdc.x = (clientX / innerWidth) * 2 - 1;
  pickNdc.y = -(clientY / innerHeight) * 2 + 1;
  pickRay.setFromCamera(pickNdc, camera);
  const meshes = [];
  insectGroups.forEach(g => g.traverse(o => { if (o.isMesh) meshes.push(o); }));
  const hits = pickRay.intersectObjects(meshes, false);
  if (!hits.length) return null;
  let node = hits[0].object;
  while (node && !node.userData.isInsect) node = node.parent;
  return node && node.userData.isInsect ? node : null;
}

function matchBeetle(id){
  if (!id) return null;
  return beetles.find(spec => spec && (spec.code === id || spec.name === id)) || null;
}
function queryRoute(){
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('view') !== 'inside') return null;
    return { inside: true, id: params.get('id') || params.get('code') || '' };
  } catch (err) {
    return null;
  }
}
function hashRoute(){
  if (!location.hash || location.hash.length < 2) return null;
  let hash = location.hash.slice(1);
  try { hash = decodeURIComponent(hash); } catch (err) {}
  if (hash.indexOf('inside/') === 0) return { inside: true, id: hash.slice('inside/'.length) };
  if (hash.indexOf('inside=') === 0) return { inside: true, id: hash.slice('inside='.length) };
  if (matchBeetle(hash)) return { inside: true, id: hash };
  return null;
}
function readTankRoute(){
  return queryRoute() || hashRoute() || { inside: false, id: '' };
}
function rememberFocusedRoute(spec){
  if (!spec || !readTankRoute().inside || !history.replaceState) return;
  const id = spec.code || spec.name || '';
  if (!id) return;
  const next = location.pathname + '?view=inside&id=' + encodeURIComponent(id);
  if (location.pathname + location.search === next) return;
  history.replaceState({ view: 'inside', id: id }, '', next);
}
function applyTankRoute(){
  if (routeHandled) return;
  const route = readTankRoute();
  if (!route.inside) return;
  const spec = matchBeetle(route.id);
  if (!spec){
    routeHandled = true;
    return;
  }
  if (!tankReady || phase === 'loading' || phase === 'detecting' || phase === 'leaving') return;
  if (phase === 'cover'){
    routeSession = true;
    routeOwnsEnter = true;
    openBox();
    return;
  }
  if (phase !== 'inside') return;
  const group = insectGroups.find(g => g.userData && g.userData.spec && (g.userData.spec.code === spec.code || g.userData.spec.model === spec.model));
  if (!group) return;
  routeSession = true;
  routeOwnsEnter = false;
  routeHandled = true;
  if (focusedInsect !== group) focusInsect(group);
}
function openBox(){
  if (phase !== 'cover' || !tankReady) return;
  phase = 'entering';
  enterStart = performance.now();
  document.documentElement.classList.add('inside');
  document.body.classList.add('inside');
  setTimeout(() => {
    if (window.ScrollTrigger) ScrollTrigger.refresh();
    if (lenis && typeof lenis.resize === 'function') lenis.resize();
  }, 60);
  if (insectGroups.length) syncPlacedInsects();
  else placeBeetles();
}

function leaveBox(){
  if (phase !== 'inside' && phase !== 'entering') return;
  routeSession = false;
  routeOwnsEnter = false;
  routeHandled = true;
  if (readTankRoute().inside && history.replaceState){
    history.replaceState({ view: 'cover' }, '', location.pathname);
  }
  clearFocus();
  if (cardEl) cardEl.classList.remove('visible');
  phase = 'leaving';
  leaveStart = performance.now();
  if (lenis) lenis.scrollTo(0, { immediate: true });
  else window.scrollTo(0, 0);
  document.documentElement.classList.remove('inside');
  document.body.classList.remove('inside');
  if (lenis && typeof lenis.resize === 'function') lenis.resize();
  syncPlacedInsects();
}

  lastY = e.clientY;
  velYaw = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  lastX = e.clientX;
  lastY = e.clientY;
  if (mobileLayout() && phase === 'inside' && !focusedInsect && Math.abs(dy) > Math.abs(dx)){
    const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    if (lenis && typeof lenis.scrollTo === 'function'){
      const current = typeof lenis.scroll === 'number' ? lenis.scroll : window.scrollY;
      lenis.scrollTo(Math.max(0, Math.min(maxScroll, current - dy)), { immediate: true });
    } else {
      const next = Math.max(0, Math.min(1, scrollProgress - dy / Math.max(innerHeight, 1)));
      applyScrollChoreography(next);
      window.scrollTo(0, next * maxScroll);
    }
    return;
  }
  const yawStep = -dx * 0.005;
  const pitchStep = dy * 0.0035;
  userYawOffset += yawStep;
  userPitchOffset = Math.max(-0.5, Math.min(0.8, userPitchOffset + pitchStep));
  targetOrbitYaw += yawStep;
  targetOrbitPitch = Math.max(-0.12, Math.min(1.28, targetOrbitPitch + pitchStep));
  velYaw = yawStep;
});
function endDrag(e){
  if (dragging && !dragMoved && phase === 'inside'){
    const hit = pickInsect(e.clientX, e.clientY);
    if (hit) focusInsect(hit);
    else if (focusedInsect) clearFocus();
  }
  dragging = false;
  document.body.classList.remove('dragging');
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (focusedInsect) clearFocus();
    else if (phase === 'inside') leaveBox();
  }
});

// Plain wheel scrolls the camera path through Lenis. Alt, Ctrl, or a focused specimen zooms instead.
renderer.domElement.addEventListener('wheel', (e) => {
  if (phase === 'cover'){
    if (e.deltaY > 8) openBox();
    return;
  }
  if (phase !== 'inside') return;
  if (!(e.altKey || e.ctrlKey || focusedInsect)) return;
  e.preventDefault();
  e.stopPropagation();
  if (lenis && typeof lenis.scrollTo === 'function') {
    const locked = Math.round(typeof lenis.scroll === 'number' ? lenis.scroll : window.scrollY);
    lenis.scrollTo(locked, { immediate: true });
  }
  const line = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  const step = Math.max(-0.55, Math.min(0.55, e.deltaY * line * 0.0045));
  userRadiusOffset += step;
  targetRadius = Math.max(radiusMin, Math.min(radiusMax, targetRadius + step));
}, { passive: false });

const camNow = new THREE.Vector3();
const lookNow = new THREE.Vector3();
const insideTone = new THREE.Color(0xe7e3da);
const coverFov = 32;
const insideFov = 42;

function setOrbitCamera(){
  const cy = Math.cos(orbitPitch);
  camera.position.set(
    focus.x + Math.sin(orbitYaw) * cy * radius,
    focus.y + Math.sin(orbitPitch) * radius,
    focus.z + Math.cos(orbitYaw) * cy * radius
  );
  camera.lookAt(focus);
}

let t0 = performance.now();
function tick(now){
  frameId = requestAnimationFrame(tick);
  if (contextLost) return;
  if (lenis) lenis.raf(now);
  const t = (now - t0) / 1000;
  if (boxMesh && phase === 'cover' && !reduce){
    boxMesh.rotation.y = 0.42 + Math.sin(t * 0.35) * 0.06;
  }
  if (phase === 'entering'){
    const u = Math.min(1, (now - enterStart) / (reduce ? 1 : 1700));
    const e = u * u * (3 - 2 * u);
    camNow.lerpVectors(coverPos, insidePos, e);
    lookNow.lerpVectors(lookCover, lookInside, e);
    camera.position.copy(camNow);
    camera.lookAt(lookNow);
    camera.fov = coverFov + (insideFov - coverFov) * e;
    camera.updateProjectionMatrix();
    if (boxMesh) boxMesh.rotation.y += (0 - boxMesh.rotation.y) * 0.08;
    scene.background.lerp(insideTone, 0.04);
    if (u >= 1){
      const offset = camera.position.clone().sub(focus);
      radius = targetRadius = Math.max(radiusMin, offset.length());
      orbitYaw = targetOrbitYaw = Math.atan2(offset.x, offset.z);
      orbitPitch = targetOrbitPitch = Math.asin(Math.max(-0.95, Math.min(0.95, offset.y / radius)));
      rememberHomeView();
      phase = 'inside';
      if (window.ScrollTrigger) ScrollTrigger.refresh();
      applyScrollChoreography(scrollProgress);
      if (routeOwnsEnter && !readTankRoute().inside){
        routeOwnsEnter = false;
        leaveBox();
      } else {
        applyTankRoute();
      }
    }
  }
  if (phase === 'leaving'){
    const u = Math.min(1, (now - leaveStart) / (reduce ? 1 : 1200));
    const e = u * u * (3 - 2 * u);
    camera.position.lerpVectors(insidePos, coverPos, e);
    lookNow.lerpVectors(homeFocus, lookCover, e);
    camera.lookAt(lookNow);
    camera.fov = insideFov + (coverFov - insideFov) * e;
    camera.updateProjectionMatrix();
    scene.background.lerp(new THREE.Color(0xf6f5f2), reduce ? 1 : 0.08);
    if (boxMesh) boxMesh.rotation.y += (0.42 - boxMesh.rotation.y) * 0.06;
    if (u >= 1){
      camera.position.copy(coverPos);
      camera.lookAt(lookCover);
      camera.fov = coverFov;
      camera.updateProjectionMatrix();
      scene.background.set(0xf6f5f2);
      phase = 'cover';
    }
  }
  if (phase === 'inside'){
    if (!dragging && !reduce){
      userYawOffset += velYaw;
      targetOrbitYaw += velYaw;
    }
    velYaw *= 0.94;
    const k = reduce ? 1 : 0.1;
    orbitYaw += (targetOrbitYaw - orbitYaw) * k;
    orbitPitch += (targetOrbitPitch - orbitPitch) * k;
    radius += (targetRadius - radius) * (reduce ? 1 : 0.16);
    setOrbitCamera();
    updateFloatingCard();
  }
  try {
    renderer.render(scene, camera);
  } catch (err) {
    contextLost = true;
    cancelAnimationFrame(frameId);
    console.error('畫面更新中斷', err);
    showStatus('畫面更新中斷');
  }
}
tick(t0);

window.addEventListener('resize', fitRenderer);
}

function startPage(){
  if (!window.THREE || !THREE.GLTFLoader || !THREE.WebGLRenderer){
    showStatus('3D 程式庫載入失敗');
  } else if (!window.SKELIO || !Array.isArray(SKELIO.tank)){
    showStatus('標本資料載入失敗');
  } else {
    if (location.protocol === 'file:'){
      const note = document.getElementById('protocolNote');
      if (note) note.hidden = false;
    }
    boot();
  }
}
if (window.THREE && THREE.GLTFLoader && THREE.WebGLRenderer) startPage();
else document.addEventListener('DOMContentLoaded', startPage);
</script>
</body>
